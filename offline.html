<style>
 :root{
   --paper:#f7f9fc; --surface:#ffffff; --surface-2:#eef2fa;
   --ink:#18233f; --ink-soft:#566087; --ink-faint:#8b93ab;
   --line:#e1e7f2; --line-soft:#eef1f8;
   --brand:#2d4f91; --brand-deep:#21407a; --brand-soft:#e6edfa;
   --gold:#bd8224;

   --shadow:0 1px 2px rgba(24,35,63,.04),0 4px 16px rgba(24,35,63,.05);
   --font-display:Georgia,"Times New Roman","Songti SC","Source Han Serif SC","Noto Serif CJK SC",STSong,SimSun,serif;
   --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

 }
 [data-theme="dark"]{
   --paper:#0e1525; --surface:#161f33; --surface-2:#1d2840;
   --ink:#e8edf8; --ink-soft:#a6b0c9; --ink-faint:#6e7796;
   --line:#283250; --line-soft:#222c47;
   --brand:#7aa0e8; --brand-deep:#9bb8f0; --brand-soft:#1f2d4c;
   --gold:#dcab5e;
   --correct:#52c08c; --correct-soft:#16301f; --correct-line:#2c5640;
   --mark:#6a5722; --mark-ink:#ffe7a8;
   --shadow:0 1px 2px rgba(0,0,0,.2),0 6px 20px rgba(0,0,0,.28);
 }
 *{box-sizing:border-box;}
 html,body{margin:0;height:100%;}
 body{font-family:var(--font-body);color:var(--ink);background:var(--paper);line-height:1.8;font-size:15.5px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-wrap:break-word;}
 .wrap{display:flex;min-height:100vh;}

 /* sidebar */
 aside{width:264px;flex:0 0 264px;background:var(--surface-2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 16px;}
 .brand{display:flex;align-items:center;gap:10px;padding:0 6px 4px;}
 .brand .tick{width:6px;height:26px;border-radius:3px;background:var(--gold);flex:0 0 auto;}
 .brand .t1{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.01em;line-height:1.1;}
 .brand .t2{font-size:11px;color:var(--ink-faint);letter-spacing:.16em;text-transform:uppercase;margin-top:2px;}
 #search{width:100%;margin:16px 0 14px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--surface);color:var(--ink);font-family:inherit;transition:border-color .15s,box-shadow .15s;}
 #search::placeholder{color:var(--ink-faint);}
 #search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
 #nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto;margin:0 -4px;padding:0 4px;}
 .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink-soft);text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .14s,color .14s;}
 .nav-item:hover{background:var(--brand-soft);color:var(--ink);}
 .nav-item.active{background:var(--surface);color:var(--brand-deep);border-color:var(--line);font-weight:600;box-shadow:var(--shadow);}
 .nav-num{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);min-width:18px;text-align:center;}
 .nav-item.active .nav-num{color:var(--gold);}
 .nav-name{font-size:14px;flex:1;}
 .badge{background:var(--brand);color:#fff;font-size:11px;border-radius:999px;padding:1px 8px;font-weight:600;font-family:var(--font-mono);}
 .foot{padding-top:12px;margin-top:8px;border-top:1px solid var(--line);}
 #theme{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink-soft);font-family:inherit;font-size:13px;cursor:pointer;transition:background .14s,color .14s;}
 #theme:hover{background:var(--brand-soft);color:var(--ink);}
 #theme:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

 /* main */
 main{flex:1;min-width:0;padding:46px 56px 90px;}
 .content{max-width:760px;margin:0 auto;animation:rise .16s ease;}
 @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

 .content h1{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.2;margin:0 0 6px;letter-spacing:.01em;}
 .content h1::after{content:"";display:block;width:46px;height:3px;border-radius:2px;background:var(--gold);margin-top:14px;}

 .entry{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:14px;padding:22px 26px;margin:18px 0;box-shadow:var(--shadow);}
 .entry h2{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--brand-deep);margin:0 0 14px;line-height:1.35;}
 .entry > :last-child{margin-bottom:0;}
 .question-entry{scroll-margin-top:64px;}
 .question-entry blockquote{margin-bottom:12px;}
 .answer-toggle{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:42px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--brand-deep);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .14s,border-color .14s,color .14s;}
 .answer-toggle:hover{background:var(--brand-soft);border-color:var(--brand);}
 .answer-toggle:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
 .answer-toggle .chevron{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-1px,-1px);transition:transform .16s;flex:0 0 auto;}
 .answer-toggle[aria-expanded="true"] .chevron{transform:rotate(225deg) translate(-1px,-1px);}
 .entry-details{padding-top:4px;}
 .question-options{margin:.8em 0;padding:.75em 1.1em;background:var(--surface-2);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;line-height:1.9;}
 [data-theme="dark"] .question-options{background:var(--paper);}
 .added-date{margin:-6px 0 10px;color:var(--ink-faint);font-family:var(--font-mono);font-size:12px;}
 .added-date strong{color:inherit;font-weight:500;}
 .date-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;margin:12px 0 20px;padding:9px 0;background:var(--paper);border-bottom:1px solid var(--line);}
 .date-bar-label{flex:0 0 auto;color:var(--ink-faint);font-size:12px;font-weight:600;}
 .date-list{display:flex;gap:5px;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
 .date-list::-webkit-scrollbar{display:none;}
 .date-jump{display:flex;align-items:center;gap:7px;min-height:34px;padding:6px 10px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink-soft);font-family:var(--font-mono);font-size:12px;white-space:nowrap;cursor:pointer;}
 .date-jump:hover{color:var(--brand-deep);background:var(--brand-soft);}
 .date-jump.active{color:var(--brand-deep);border-bottom-color:var(--gold);font-weight:700;}
 .date-jump:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;}
 .date-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 5px;border-radius:10px;background:var(--surface-2);color:var(--ink-faint);font-size:10px;}
 .date-jump.active .date-count{background:var(--brand-soft);color:var(--brand-deep);}
 .content h3{font-size:16px;font-weight:600;margin:1.3em 0 .4em;}

 .content p{margin:.62em 0;}
 .content > p{color:var(--ink-soft);margin:.4em 0 1.15em;}
 .content ul{margin:.5em 0;padding-left:1.3em;list-style:none;}
 .content li{margin:.34em 0;position:relative;}
 .content li::before{content:"";position:absolute;left:-1.05em;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--gold);}
 .content strong{font-weight:600;color:var(--ink);}

 .content code{font-family:var(--font-mono);font-size:.85em;background:var(--surface-2);color:var(--brand-deep);padding:.12em .42em;border-radius:5px;border:1px solid var(--line);}

 blockquote{margin:.9em 0;padding:.85em 1.1em;background:var(--surface-2);border-left:3px solid var(--brand);border-radius:0 10px 10px 0;color:var(--ink);font-size:.97em;}
 [data-theme="dark"] blockquote{background:var(--paper);}

 p.answer{display:inline-block;margin:.85em 0;padding:.32em .9em;background:var(--correct-soft);color:var(--correct);border:1px solid var(--correct-line);border-radius:999px;font-size:.93rem;line-height:1.4;}
 p.answer::before{content:"✓";font-weight:700;margin-right:.45em;}
 p.answer strong{color:var(--correct);}

 /* tri-line / booktabs table */
 table{border-collapse:collapse;width:100%;margin:1.1em 0;font-size:14px;}
 thead th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:12.5px;letter-spacing:.02em;padding:6px 14px 9px;border-bottom:2px solid var(--brand);white-space:nowrap;}
 tbody td{padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
 tbody tr:last-child td{border-bottom:none;}
 tbody tr:hover td{background:var(--surface-2);}
 td code{white-space:nowrap;}

 mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:3px;}
 a{color:var(--brand);text-decoration:none;border-bottom:1px solid var(--brand-soft);}
 a:hover{border-bottom-color:var(--brand);}
 .empty{color:var(--ink-faint);padding:2em 0;}
 :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px;}

 @media (max-width:820px){
   .wrap{flex-direction:column;}
   aside{width:auto;flex:none;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--line);padding:16px 16px 12px;}
   .brand{padding-right:92px;}
   #search{font-size:16px;margin:14px 0 12px;}
   #nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0;padding:2px 0 4px;flex:none;gap:6px;scrollbar-width:none;}
   #nav::-webkit-scrollbar{display:none;}
   .nav-item{white-space:nowrap;padding:9px 13px;}
   .nav-name{flex:none;}
   .foot{display:block;position:absolute;top:12px;right:14px;margin:0;padding:0;border-top:none;}
   #theme{width:auto;padding:7px 12px;}
   main{padding:26px 18px 60px;}
   .content h1{font-size:24px;}
   .entry{padding:18px 16px;}
   table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
   thead th{white-space:normal;}
   td code{white-space:normal;}
 }
 @media (prefers-reduced-motion:reduce){
   *{animation:none!important;transition:none!important;}
 }
</style>

<script>
var NOTES = [{"name": "01_试题集.md", "label": "01 试题集", "md": "# 01 试题集\n\n完整保存每道试题及自包含的详细题解。每题都覆盖句子结构、语法知识、词汇与固定搭配、选项辨析和解题提示，单独看题即可完成一次完整复习。每题给一个递增编号（如 `#012`），**新题追加在最后、编号递增**。\n\n\u003c!-- 新增题目时，复制下面这段模板到本注释下方填写；模板本身保留，供下次使用。\n\n## #编号 · Part X · 一句话考点\n\n**添加日期**：YYYY-MM-DD\n\n> 题干 ……（空格用 ___ 表示）\n> (A) …　(B) …　(C) …　(D) …\n\n**译文**：题干中文翻译（填空题代入正确答案译整句）。\n\n**答案**：X\n\n**解析**\n- 核心考点：这道题直接考什么；快速定位答案的信号是什么。\n- 句子结构：拆出主语、谓语、宾语 / 表语，并说明从句、非谓语、介词短语、同位语等修饰关系。\n- 语法知识：讲清相关结构公式、词性位置、时态语态、主谓一致等规则，不只解释空格局部。\n- 词汇与固定搭配：总结题干中值得掌握的单词、词性、含义、短语和搭配。\n- 正确项：X 为什么对。\n- 干扰项：(A) 为什么错；(B) 为什么错；(D) 为什么错。\n- 解题提示：这类题的判断顺序、易错点或可迁移方法。\n- 听力题补充：连读 / 弱读、同义替换、场景信号词。\n\n-->\n\n## #001 · Part 5 · 介词短语 prior to 表「在……之前」\n\n**添加日期**：2026-06-22\n\n> The workshop materials will be sent to participants at least ten business days ___ the scheduled session.\n> (A) in case　(B) as much　(C) prior to　(D) by then\n\n**译文**：研讨会材料会在预定场次至少十个工作日前发送给参会者。\n\n**答案**：C\n\n**解析**\n- 核心考点：空格后是名词短语 `the scheduled session`，需要一个能带名词宾语、表「在……之前」的介词（短语）。\n- 句子结构：主语是 `The workshop materials`，谓语是将来时被动结构 `will be sent`；`to participants` 表示接收者，`at least ten business days prior to the scheduled session` 是时间状语。\n- 语法知识：`will be + 过去分词` 构成一般将来时被动语态；`prior to` 是复合介词，后接名词或名词短语。介词后不能直接接完整句子，副词短语后也不能再带名词宾语。\n- 词汇与固定搭配：`workshop materials` 研讨会材料；`participant` 参与者；`business day` 工作日；`scheduled session` 预定场次；`send sth to sb` 把某物发送给某人。\n- 正确项 C：`prior to` = before，`ten business days prior to the scheduled session` 意为「预定会议前十个工作日」。\n- 干扰项：(A) `in case` 是连词，要接句子或写成 `in case of + 名词`，义为「以防」，这里接不了名词也不通；(B) `as much` 是数量副词短语，不能连接名词；(D) `by then`（到那时）是副词短语，后面不能直接跟名词。\n- 解题提示：先看空格后的成分。后面只有名词短语时，应优先在介词或介词短语中选择，再根据时间含义确定答案。\n\n\n## #002 · Part 5 · rapid expansion 表「快速扩张」\n\n**添加日期**：2026-06-22\n\n> The Apparel Boutique has seen ___ expansion in East Asia due to the popularity of its clothing lines.\n> (A) loud　(B) rapid　(C) bright　(D) proud\n\n**译文**：由于其服装系列很受欢迎，The Apparel Boutique 在东亚经历了快速扩张。\n\n**答案**：B\n\n**解析**\n- 核心考点：空格修饰名词 `expansion`，要选能表示「扩张速度 / 增长速度」的形容词。\n- 句子结构：主语是 `The Apparel Boutique`，谓语是现在完成时 `has seen`，宾语是 `rapid expansion`；`in East Asia` 表范围，`due to the popularity of its clothing lines` 表原因。\n- 语法知识：名词前通常用形容词作定语；`has seen` 是 `have/has + 过去分词`，这里表示公司迄今经历的变化；`due to + 名词短语` 作原因状语。\n- 词汇与固定搭配：`rapid expansion` 快速扩张；`see expansion` 经历扩张；`due to` 由于；`the popularity of` ……的受欢迎程度；`clothing line` 服装产品线。\n- 正确项 B：`rapid` 表「快速的」，能修饰增长、扩张、变化等商业抽象名词；`has seen rapid expansion` 意为「经历了快速扩张」。\n- 干扰项：(A) `loud` 表声音大，或颜色 / 风格醒目，不能修饰 `expansion`；(C) `bright` 表明亮、聪明或前景光明，常修饰 `light / color / future / prospect`，不表示扩张速度；(D) `proud` 表自豪的，通常用于人或组织，如 `be proud of`，不能修饰 `expansion`。\n- 解题提示：四个选项都是形容词时，词性已经满足要求，下一步要检查名词搭配和语义；描述增长或扩张速度常用 `rapid`。\n\n\n## #003 · Part 5 · 动词前缺主语用主格代词\n\n**添加日期**：2026-06-22\n\n> Here at Auto Empire, ___ always put quality service and customer care first.\n> (A) ourselves　(B) ours　(C) we　(D) us\n\n**译文**：在 Auto Empire，我们始终把优质服务和客户关怀放在首位。\n\n**答案**：C\n\n**解析**\n- 核心考点：逗号后的谓语是 `put`，空格处要作句子主语，所以需要主格代词。\n- 句子结构：`Here at Auto Empire` 是句首地点状语；主语是 `we`，谓语是 `put`，并列宾语是 `quality service and customer care`，`first` 表示优先顺序。\n- 语法知识：谓语动词前缺主语时用主格代词；`always` 是频率副词，通常放在实义动词前；`put + 宾语 + first` 表示把某事放在首位。\n- 词汇与固定搭配：`quality service` 优质服务；`customer care` 客户关怀；`put quality service and customer care first` 把优质服务和客户关怀放在首位。\n- 正确项 C：`we` 是主格，可作主语，和 `always put` 构成完整主谓结构。\n- 干扰项：(A) `ourselves` 是反身代词，不能单独作主语；(B) `ours` 是名词性物主代词，表示「我们的东西」，不能作执行 `put` 的主语；(D) `us` 是宾格，不能放在谓语动词前作主语。\n- 解题提示：先圈出谓语 `put`。谓语前没有主语，就按句子成分选主格，不要先凭中文含义挑代词。\n\n\n## #004 · Part 5 · the largest of all 表最高级范围\n\n**添加日期**：2026-06-22\n\n> The store that Ms. Goh manages is the ___ of all the company’s retail locations.\n> (A) large　(B) larger　(C) largely　(D) largest\n\n**译文**：Goh 女士管理的那家商店是公司所有零售点中最大的。\n\n**答案**：D\n\n**解析**\n- 核心考点：`the ___ of all ...` 给出「所有……之中」的范围，空格处要用形容词最高级。\n- 句子结构：主语是 `The store that Ms. Goh manages`，其中 `that Ms. Goh manages` 是限制性定语从句；系动词是 `is`，表语是 `the largest`，`of all the company’s retail locations` 给出比较范围。\n- 语法知识：三者及以上比较用 `the + 形容词最高级`；`of all + 复数名词` 是最高级的典型范围信号。定语从句中 `that` 作 `manages` 的宾语。\n- 词汇与固定搭配：`manage a store` 管理商店；`retail location` 零售点；`the largest of all` 所有对象中最大的。\n- 正确项 D：`largest` 是 `large` 的最高级，`the largest of all the company’s retail locations` 表示「所有零售点中最大的」。\n- 干扰项：(A) `large` 是原级，只表示「大」，不能表达三者及以上范围内的最高程度；(B) `larger` 是比较级，通常用于两者比较或和 `than` 搭配，不符合 `of all` 的范围；(C) `largely` 是副词，表示「主要地 / 很大程度上」，不能放在 `the` 后作名词化最高级。\n- 解题提示：看到 `the` 和 `of all` 前后呼应，可直接锁定最高级；随后确认最高级词形是否正确。\n\n\n## #005 · Part 5 · 句子缺谓语：主语后选限定动词（过去式 suggested）\n\n**添加日期**：2026-06-22\n\n> After several consecutive days of delays due to bad weather, the director ___ filming the scene inside the studio.\n> (A) suggesting　(B) suggest　(C) suggestion　(D) suggested\n\n**译文**：连续几天因恶劣天气延误之后，导演建议在摄影棚内拍摄这个场景。\n\n**答案**：D\n\n**解析**\n- 核心考点：主语 `the director` 之后缺谓语动词，要选能作谓语的限定动词，再核对主谓一致与时态。\n- 句子结构：`After several consecutive days of delays due to bad weather` 是时间状语；主语是 `the director`，谓语是 `suggested`，动名词短语 `filming the scene inside the studio` 作宾语。\n- 语法知识：完整句子必须有与主语对应的限定谓语；`suggest doing sth` 中 `doing` 作宾语，不能说 `suggest to do`；`due to + 名词` 修饰 `delays`，说明延误原因。\n- 词汇与固定搭配：`consecutive days` 连续数日；`delays due to bad weather` 因恶劣天气造成的延误；`suggest filming` 建议拍摄；`film a scene` 拍摄场景；`inside the studio` 在摄影棚内。\n- 正确项 D：`suggested` 是过去式，可作谓语且不受人称影响；时间状语 `After several consecutive days of delays`（连续几天延误之后）表明动作已发生，用过去时。\n- 干扰项：(A) `suggesting` 是现在分词，前面没有 be 动词，不能单独作谓语；(B) `suggest` 是动词原形，主语是第三人称单数，一般现在时须用 `suggests`，原形与主语不一致；(C) `suggestion` 是名词，不能作谓语。\n- 解题提示：先忽略句首长状语，找到主语 `the director`。主语后没有谓语时，只保留能独立作谓语且时态合理的选项。\n\n\n## #006 · Part 5 · 所有格后缺主语名词用 teachers\n\n**添加日期**：2026-06-22\n\n> Singh Design Institute’s ___ are active professionals who have worked in the industry for many years.\n> (A) teach　(B) taught　(C) teaching　(D) teachers\n\n**译文**：Singh Design Institute 的教师都是活跃的专业人士，他们已在该行业工作多年。\n\n**答案**：D\n\n**解析**\n- 核心考点：空格前是所有格 `Singh Design Institute’s`，空格后是复数谓语 `are`，这里需要一个复数名词作主语。\n- 句子结构：主语是 `Singh Design Institute’s teachers`，系动词是 `are`，表语是 `active professionals`；`who have worked in the industry for many years` 是修饰 `professionals` 的定语从句。\n- 语法知识：所有格后接名词构成名词短语；复数谓语 `are` 要与复数主语一致；`who` 在定语从句中指人并作主语，`have worked` 是现在完成时，`for many years` 表持续时间。\n- 词汇与固定搭配：`design institute` 设计学院；`active professionals` 活跃的专业人士；`work in the industry` 在该行业工作；`for many years` 多年来。\n- 正确项 D：`teachers` 是复数名词，能和 `are active professionals` 构成主谓一致。\n- 干扰项：(A) `teach` 是动词原形，不能放在所有格后作名词主语；(B) `taught` 是过去式 / 过去分词，不能作复数主语；(C) `teaching` 可作动名词或现在分词，但不表示一群人，且不能和复数谓语 `are` 搭配。\n- 解题提示：同时利用空格前的所有格和空格后的复数谓语，可以确定答案必须是表示人的复数名词。\n\n\n## #007 · Part 5 · due to 后接名词短语表原因\n\n**添加日期**：2026-06-22\n\n> ___ the heavy rain this morning, the city’s subway system is experiencing delays.\n> (A) While　(B) Because　(C) Due to　(D) Assuming\n\n**译文**：由于今天早上的大雨，该市的地铁系统正在出现延误。\n\n**答案**：C\n\n**解析**\n- 核心考点：空格后是名词短语 `the heavy rain this morning`，需要能接名词短语并表示原因的介词短语。\n- 句子结构：`Due to the heavy rain this morning` 是原因状语；主语是 `the city’s subway system`，谓语是现在进行时 `is experiencing`，宾语是 `delays`。\n- 语法知识：`due to / because of + 名词短语`，而 `because + 主语 + 谓语`；`is experiencing` 表示当前正在发生的运营异常；所有格 `city’s` 修饰 `subway system`。\n- 词汇与固定搭配：`heavy rain` 大雨；`subway system` 地铁系统；`experience delays` 出现或遭遇延误；`this morning` 今天早上。\n- 正确项 C：`Due to + 名词短语` 表「由于……」，能直接接 `the heavy rain this morning` 作原因状语。\n- 干扰项：(A) `While` 是连词，后面要接主谓完整的句子，且常表「当……时 / 虽然」；(B) `Because` 是连词，后面要接句子，不能直接接名词短语；(D) `Assuming` 表「假设」，通常引出条件，不表示既成事实的原因。\n- 解题提示：原因表达的关键不是中文意思，而是后接成分：后接名词选介词短语，后接完整句子才选连词。\n\n\n## #008 · Part 5 · so powerful that 表「如此……以至于」\n\n**添加日期**：2026-06-22\n\n> Our new electric saw is ___ powerful that it can cut sheets of metal up to one centimeter thick.\n> (A) often　(B) so　(C) quite　(D) too\n\n**译文**：我们的新电锯非常强劲，能切割厚达一厘米的金属板。\n\n**答案**：B\n\n**解析**\n- 核心考点：空格后是形容词 `powerful`，后面还有 `that + 句子` 表结果，需要 `so + 形容词 + that` 结构。\n- 句子结构：主句是 `Our new electric saw is so powerful`；`that it can cut sheets of metal up to one centimeter thick` 是结果状语从句，其中 `it` 指代电锯，`can cut` 表能力。\n- 语法知识：`so + 形容词 / 副词 + that + 句子` 表示程度导致的结果；情态动词 `can` 后接动词原形；`数量 + 形容词` 可表示尺寸，如 `one centimeter thick`。\n- 词汇与固定搭配：`electric saw` 电锯；`powerful` 强劲的；`cut sheets of metal` 切割金属板；`up to` 多达、最高达到；`one centimeter thick` 一厘米厚。\n- 正确项 B：`so powerful that it can cut ...` 表「强劲到能够切割……」，`so` 和 `that` 呼应，连接程度与结果。\n- 干扰项：(A) `often` 是频率副词，不能修饰 `powerful` 表结果；(C) `quite` 可表示「相当」，但不能和后面的 `that` 构成结果结构；(D) `too` 常用 `too + 形容词 + to do` 表「太……以至于不能 / 不适合」，不能接这里的 `that` 结果句。\n- 解题提示：后面的 `that + 完整句子` 是强信号。看到前面紧邻形容词，优先检查 `so ... that ...`。\n\n\n## #009 · Part 5 · financial specialist 表财务专员\n\n**添加日期**：2026-06-22\n\n> The Langdon Company’s financial ___, Richard Bigsby, handles all budgetary decisions.\n> (A) special　(B) specialization　(C) specialize　(D) specialist\n\n**译文**：The Langdon Company 的财务专员 Richard Bigsby 负责处理所有预算决策。\n\n**答案**：D\n\n**解析**\n- 核心考点：`financial` 是形容词，后面要接名词；逗号中的 `Richard Bigsby` 是人名同位语，说明空格处应是表示人的职位名词。\n- 句子结构：主语是 `The Langdon Company’s financial specialist`；`Richard Bigsby` 是同位语，补充主语身份；谓语是 `handles`，宾语是 `all budgetary decisions`。\n- 语法知识：形容词 `financial` 后接名词；同位语与前面的名词指同一人；主语中心词 `specialist` 是单数，因此一般现在时谓语用第三人称单数 `handles`。\n- 词汇与固定搭配：`financial specialist` 财务专员；`handle decisions` 处理决策事项；`budgetary decision` 预算决策；`all + 复数名词` 表全部。\n- 正确项 D：`specialist` 表「专员 / 专家」，`financial specialist` 是能指人的职位名词，和后面的单数谓语 `handles` 一致。\n- 干扰项：(A) `special` 是形容词，不能被 `financial` 修饰后再作主语名词；(B) `specialization` 是抽象名词，表示「专业化 / 专长」，不能和人名 `Richard Bigsby` 构成同位关系；(C) `specialize` 是动词，不能放在形容词 `financial` 后作名词。\n- 解题提示：逗号中的人名是职位名词的提示。先判定空格需要“表示人的名词”，再检查主谓一致。\n\n\n## #010 · Part 5 · an expert in 表「某领域专家」\n\n**添加日期**：2026-06-22\n\n> Belmond College is excited to announce that this month’s guest speaker is Joshua Ramsey, an ___ in climate science.\n> (A) expertise　(B) expert　(C) expertly　(D) experts\n\n**译文**：Belmond College 很高兴宣布，本月的嘉宾演讲者是气候科学专家 Joshua Ramsey。\n\n**答案**：B\n\n**解析**\n- 核心考点：空格前有冠词 `an`，后面有介词短语 `in climate science` 修饰身份，空格处需要单数可数名词。\n- 句子结构：主句是 `Belmond College is excited`；不定式 `to announce` 说明高兴做什么，`that` 引导 announce 的宾语从句；`an expert in climate science` 是 `Joshua Ramsey` 的同位语。\n- 语法知识：`an + 单数可数名词`；同位语补充说明人物身份；`be excited to do sth` 表示很高兴做某事；`announce that + 句子` 中 `that` 引导宾语从句。\n- 词汇与固定搭配：`be excited to announce` 很高兴宣布；`guest speaker` 嘉宾演讲者；`an expert in` ……领域的专家；`climate science` 气候科学。\n- 正确项 B：`expert` 是表示人的单数名词，`an expert in climate science` 表示「气候科学专家」，可作 `Joshua Ramsey` 的同位语。\n- 干扰项：(A) `expertise` 是不可数抽象名词，表示专业知识，不指人，不能和 `an` 搭配；(C) `expertly` 是副词，不能放在冠词后作名词；(D) `experts` 是复数名词，前面不能用单数冠词 `an`。\n- 解题提示：冠词 `an` 先锁定单数可数名词，人名后的同位语再锁定“表示人的名词”。\n\n\n## #011 · Part 5 · 过去分词 established 作后置定语\n\n**添加日期**：2026-06-22\n\n> The EGW is a new environmental agency ___ to address the city’s pollution problem.\n> (A) establish　(B) established　(C) establishing　(D) was established\n\n**译文**：EGW 是一个为解决该市污染问题而成立的新环保机构。\n\n**答案**：B\n\n**解析**\n- 核心考点：句子已有谓语 `is`，空格在名词 `agency` 后面，需要非谓语形式作后置定语，说明这个机构「被成立」的目的。\n- 句子结构：主语是 `The EGW`，系动词是 `is`，表语是 `a new environmental agency`；`established to address ...` 后置修饰 `agency`，其中不定式 `to address` 表成立目的。\n- 语法知识：过去分词作后置定语表示被动，相当于 `an agency that was established ...`；一个简单句没有连接词时只能有一个限定谓语；`to do` 可作目的状语。\n- 词汇与固定搭配：`environmental agency` 环保机构；`be established to do sth` 为做某事而成立；`address a problem` 处理问题；`pollution problem` 污染问题。\n- 正确项 B：`established` 是过去分词，表示被动关系，相当于 `an agency that was established to address ...`。\n- 干扰项：(A) `establish` 是动词原形，不能直接放在名词后作定语；(C) `establishing` 是现在分词，表示主动关系，会变成「机构正在成立……」，不合逻辑；(D) `was established` 是完整谓语，前面已有 `is`，会造成一个句子里出现两个谓语且没有连接词。\n- 解题提示：先数限定谓语。已有 `is` 后，排除另一个完整谓语，再根据 `agency` 与 `establish` 的被动关系选过去分词。\n\n\n## #012 · Part 5 · designated parking space 表「指定停车位」\n\n**添加日期**：2026-06-22\n\n> Each employee is expected to use their ___ parking space.\n> (A) designating　(B) designated　(C) designation　(D) designate\n\n**译文**：每位员工都应使用自己的指定停车位。\n\n**答案**：B\n\n**解析**\n- 核心考点：空格后是名词短语 `parking space`，前面已有物主限定词 `their`，空格处要用能修饰名词的形容词性成分。\n- 句子结构：主语是 `Each employee`，谓语是被动结构 `is expected`；不定式 `to use` 是被期望执行的动作，宾语是 `their designated parking space`。\n- 语法知识：`each + 单数名词` 作主语时谓语用单数；`be expected to do sth` 表示被要求或应该做某事；过去分词 `designated` 作前置定语表示停车位已被指定；`their` 可作性别中性的单数指代。\n- 词汇与固定搭配：`employee` 员工；`be expected to do sth` 应当做某事；`designated parking space` 指定停车位；`use a parking space` 使用停车位。\n- 正确项 B：`designated` 是过去分词形容词，表示「指定的」，`designated parking space` 是固定常见搭配。\n- 干扰项：(A) `designating` 是现在分词，表示主动动作，像「正在指定的停车位」，不合逻辑；(C) `designation` 是名词，不能直接放在 `parking space` 前表达「指定的」；(D) `designate` 是动词原形，不能作名词前定语。\n- 解题提示：名词前需要定语时先判词性，再判断主动或被动关系；停车位是“被指定”的，所以用过去分词。\n\n\n## #013 · Part 5 · through the holiday season 表持续贯穿假期\n\n**添加日期**：2026-06-22\n\n> The current upward trend in sales is likely to continue ___ the upcoming holiday season.\n> (A) whenever　(B) through　(C) including　(D) once\n\n**译文**：目前销售额的上升趋势很可能会持续整个即将到来的假日季。\n\n**答案**：B\n\n**解析**\n- 核心考点：空格后是名词短语 `the upcoming holiday season`，句意需要表示趋势持续贯穿某一时间段。\n- 句子结构：主语是 `The current upward trend in sales`，系动词是 `is`，表语是 `likely`；不定式 `to continue` 补充 likely 的内容，`through the upcoming holiday season` 是时间状语。\n- 语法知识：`be likely to do sth` 表可能发生；`through + 时间段` 表动作持续贯穿整个期间；介词后接名词短语，而连词后应接完整句子。\n- 词汇与固定搭配：`current upward trend in sales` 当前销售上升趋势；`be likely to continue` 很可能持续；`upcoming holiday season` 即将到来的假日季。\n- 正确项 B：`through + 时间段` 表「贯穿……期间 / 直到……结束」，`continue through the upcoming holiday season` 表示「持续整个即将到来的假日季」。\n- 干扰项：(A) `whenever` 是连词，后面要接主谓完整的句子，不能直接接名词短语；(C) `including` 表「包括」，用于列举包含对象，不表示持续时间；(D) `once` 是连词或副词，作连词时也要接句子，且语义是「一旦」。\n- 解题提示：先判断空格后是名词短语，因此排除要求接句子的连词；再根据 `continue` 的持续含义选择时间介词。\n\n\n## #014 · Part 5 · particularly soft materials 表「特别柔软的材料」\n\n**添加日期**：2026-06-22\n\n> Jackson Bedding’s mattress lines have been praised for the particularly ___ materials they use.\n> (A) soften　(B) softness　(C) soft　(D) softly\n\n**译文**：Jackson Bedding 的床垫系列因其使用的材料特别柔软而受到称赞。\n\n**答案**：C\n\n**解析**\n- 核心考点：空格后是名词 `materials`，前面有副词 `particularly`，结构应为 `particularly + 形容词 + 名词`，所以空格处要填形容词。\n- 句子结构：主语是 `Jackson Bedding’s mattress lines`，谓语是现在完成时被动语态 `have been praised`；`for ... materials` 表受称赞的原因，`they use` 是省略关系代词的定语从句，修饰 `materials`。\n- 语法知识：程度副词可修饰形容词，形成 `副词 + 形容词 + 名词`；`have been + 过去分词` 构成现在完成时被动语态；关系代词在限制性定语从句中作宾语时可以省略，完整形式是 `materials that they use`。\n- 词汇与固定搭配：`mattress line` 床垫产品线；`be praised for` 因……受到称赞；`particularly soft materials` 特别柔软的材料；`use materials` 使用材料。\n- 正确项 C：`soft` 是形容词，`particularly soft materials` 表示「特别柔软的材料」，可自然说明床垫材料的特点。\n- 干扰项：(A) `soften` 是动词，不能放在 `materials` 前作定语；(B) `softness` 是名词，不能被 `particularly` 直接修饰后再修饰 `materials`；(D) `softly` 是副词，通常修饰动词或形容词，不能直接修饰名词 `materials`。\n- 解题提示：看到“副词 + 空格 + 名词”时，空格通常是形容词；同时检查副词能否自然修饰该形容词。\n\n\n## #015 · Part 5 · under construction 表「正在建设中」\n\n**添加日期**：2026-07-07\n\n> A new annex, which will expand the Bayview Mall, is currently under ___.\n> (A) construction　(B) building　(C) processing　(D) decision\n\n**译文**：一个将扩建 Bayview Mall 的新附属建筑目前正在建设中。\n\n**答案**：A\n\n**解析**\n- 核心考点：`under + 名词` 可表示某事处于某种进行中的状态，建筑项目常用固定表达 `under construction`。\n- 句子结构：主语是 `A new annex`；逗号中的 `which will expand the Bayview Mall` 是非限制性定语从句；主句谓语是 `is`，表语是 `under construction`，`currently` 修饰状态。\n- 语法知识：`under + 抽象名词` 可表示处于某过程或状态；非限制性定语从句用逗号隔开，`which` 指代物 `annex`，不能省略；一般将来时 `will expand` 表扩建完成后的作用。\n- 词汇与固定搭配：`annex` 附属建筑；`expand a mall` 扩建商场；`currently under construction` 目前正在施工；`new annex` 新附楼。\n- 正确项 A：`construction` 是名词，`under construction` 表示「正在建设中」，正好对应前面的 `A new annex`。\n- 干扰项：(B) `building` 可作名词或动名词，但标准表达不是 `under building`；(C) `processing` 表「处理中 / 加工」，用于订单、申请、数据等，不用于建筑物施工状态；(D) `decision` 表「决定」，`under decision` 不是自然搭配，若表示讨论或考虑通常说 `under consideration`。\n- 解题提示：`under` 后四个选项都可能是名词时，要依赖固定搭配和主语场景；建筑物的施工状态固定说 `under construction`。\n\n\n## #016 · Part 5 · temporarily suspended 表「暂时暂停」\n\n**添加日期**：2026-07-07\n\n> Train service to and from the Luzern District will be ___ suspended while repairs are being made.\n> (A) accurately　(B) temporarily　(C) broadly　(D) privately\n\n**译文**：在维修进行期间，往返 Luzern District 的列车服务将暂时暂停。\n\n**答案**：B\n\n**解析**\n- 核心考点：空格修饰过去分词形容词 `suspended`，要选能说明暂停时间性质的副词。\n- 句子结构：主语是 `Train service to and from the Luzern District`，谓语是将来时被动结构 `will be suspended`；`temporarily` 修饰 `suspended`，`while repairs are being made` 是时间状语从句。\n- 语法知识：副词可修饰动词、形容词或过去分词；`will be + 过去分词` 是一般将来时被动语态；`are being made` 是现在进行时被动语态，表示维修正在进行。\n- 词汇与固定搭配：`train service to and from` 往返……的列车服务；`temporarily suspended` 暂时暂停；`make repairs` 进行维修；`while repairs are being made` 在维修期间。\n- 正确项 B：`temporarily` 表「暂时地」，`temporarily suspended` 是通知中常见表达，说明服务暂停不是永久取消，而是在维修期间暂停。\n- 干扰项：(A) `accurately` 表「准确地」，通常修饰测量、描述、记录等动作；(C) `broadly` 表「广泛地 / 大体上」，不能说明服务暂停的时间性质；(D) `privately` 表「私下地 / 私人地」，和公共交通服务暂停无关。\n- 解题提示：四项都是副词时，词性无法区分答案，应根据被修饰词 `suspended` 和维修语境选择表示持续时间性质的副词。\n\n\n## #017 · Part 5 · innovative advertising campaign 表「创新的广告活动」\n\n**添加日期**：2026-07-07\n\n> Mr. Bamber praised Ms. Fong for producing such an ___ advertising campaign for the new line of televisions.\n> (A) innovation　(B) innovate　(C) innovative　(D) innovatively\n\n**译文**：Bamber 先生称赞 Fong 女士为新电视产品线制作了如此创新的广告活动。\n\n**答案**：C\n\n**解析**\n- 核心考点：空格后是单数名词短语 `advertising campaign`，前面有 `such an`，结构应为 `such an + 形容词 + 单数名词`。\n- 句子结构：主语是 `Mr. Bamber`，谓语是 `praised`，宾语是 `Ms. Fong`；`for producing ...` 表称赞原因，`for the new line of televisions` 修饰 `advertising campaign`。\n- 语法知识：`praise sb for doing sth` 中介词 `for` 后接动名词；`such a/an + 形容词 + 单数可数名词` 表示“如此……的一个……”；`an` 由后接词的发音决定。\n- 词汇与固定搭配：`praise sb for doing sth` 因做某事称赞某人；`produce an advertising campaign` 制作广告活动；`innovative advertising campaign` 创新的广告活动；`line of televisions` 电视产品线。\n- 正确项 C：`innovative` 是形容词，能修饰 `advertising campaign`，表示「创新的广告活动」。\n- 干扰项：(A) `innovation` 是名词，不能放在 `advertising campaign` 前作形容词；(B) `innovate` 是动词，不能修饰名词；(D) `innovatively` 是副词，通常修饰动词或形容词，不能直接修饰名词短语 `advertising campaign`。\n- 解题提示：先利用 `such an` 和后面的单数名词确定空格必须是形容词，再检查词形。\n\n\n## #018 · Part 5 · many opportunities 修饰复数可数名词\n\n**添加日期**：2026-07-07\n\n> At the Food & Beverage Fair, there will be ___ opportunities to sample products and learn how they are made.\n> (A) plenty　(B) most　(C) many　(D) every\n\n**译文**：在 Food & Beverage Fair 上，将有许多机会试吃 / 试用产品，并了解它们是如何制作的。\n\n**答案**：C\n\n**解析**\n- 核心考点：空格后是复数可数名词 `opportunities`，需要能直接修饰复数可数名词的量词。\n- 句子结构：`At the Food & Beverage Fair` 是地点状语；主句是将来时存在句 `there will be many opportunities`；两个并列不定式 `to sample products` 和 `learn how they are made` 修饰 `opportunities`。\n- 语法知识：`many + 复数可数名词`；`there will be` 表示将来会有；`to sample ... and learn ...` 由 `and` 连接并共享 `to`；`how they are made` 是由 `how` 引导的宾语从句，其中使用被动语态。\n- 词汇与固定搭配：`Food & Beverage Fair` 食品饮料展会；`opportunity to do sth` 做某事的机会；`sample products` 试吃或试用产品；`learn how ...` 了解……如何进行。\n- 正确项 C：`many` 可直接修饰复数可数名词，`many opportunities to sample products` 表示「许多试吃 / 试用产品的机会」。\n- 干扰项：(A) `plenty` 不能直接放在名词前，通常要写 `plenty of opportunities`；(B) `most` 表「大多数」或最高程度，句中没有限定范围，不符合「许多机会」的意思；(D) `every` 后接单数可数名词，不能接复数 `opportunities`。\n- 解题提示：量词题先判断名词是否可数及单复数。`opportunities` 是复数可数名词，直接匹配 `many`。\n\n\n## #019 · Part 5 · be regarded as 表「被视为」\n\n**添加日期**：2026-07-07\n\n> Charles Campbell ___ as one of the most influential modern authors.\n> (A) regards　(B) is regarded　(C) regarding　(D) has regarded\n\n**译文**：Charles Campbell 被视为最有影响力的现代作家之一。\n\n**答案**：B\n\n**解析**\n- 核心考点：主语 `Charles Campbell` 是被评价的人，后面有 `as one of ...`，需要被动结构 `be regarded as`。\n- 句子结构：主语是 `Charles Campbell`，谓语是一般现在时被动结构 `is regarded`；`as one of the most influential modern authors` 是主语补足语，说明他被视为什么。\n- 语法知识：主动结构是 `regard A as B`，A 作主语时改为 `A be regarded as B`；`one of + the + 最高级 + 复数名词` 表“最……之一”，其中名词必须用复数。\n- 词汇与固定搭配：`be regarded as` 被视为；`one of the most influential ...` 最有影响力的……之一；`modern author` 现代作家。\n- 正确项 B：`is regarded` 构成一般现在时被动语态，`is regarded as one of ...` 表示「被视为……之一」。\n- 干扰项：(A) `regards` 是主动语态，意思会变成 Charles Campbell 把别人视为……，但句中没有宾语；(C) `regarding` 是现在分词或介词，不能单独作谓语；(D) `has regarded` 是主动完成时，同样缺少宾语，不能表达「被视为」。\n- 解题提示：判断主语是动作发出者还是承受者。人物是“被认为”有影响力，且后有 `as`，应立即想到 `be regarded as`。\n\n\n## #020 · Part 5 · same-day delivery program 表「当日配送计划」\n\n**添加日期**：2026-07-07\n\n> Meridian Town was already participating in Bigmart’s same-day ___ program, which began in select markets last fall.\n> (A) deliver　(B) delivered　(C) delivers　(D) delivery\n\n**译文**：Meridian Town 当时已经在参与 Bigmart 的当日配送计划，该计划去年秋天先在部分市场启动。\n\n**答案**：D\n\n**解析**\n- 核心考点：空格位于 `same-day` 和 `program` 之间，需要名词作定语，说明这是哪类计划。\n- 句子结构：主语是 `Meridian Town`，谓语是过去进行时 `was participating`；`in Bigmart’s same-day delivery program` 是介词宾语，`which began in select markets last fall` 是补充说明该计划的非限制性定语从句。\n- 语法知识：名词可作前置定语说明用途或类别，如 `delivery program`；`participate` 是不及物动词，要与 `in` 搭配；过去进行时表示过去某时正在参与；`which` 指物并在从句中作主语。\n- 词汇与固定搭配：`participate in a program` 参与计划；`same-day delivery` 当日配送；`select markets` 部分选定市场；`last fall` 去年秋季。\n- 正确项 D：`delivery` 是名词，`same-day delivery program` 表示「当日配送计划」，是零售 / 电商场景常见复合名词。\n- 干扰项：(A) `deliver` 是动词原形，不能直接修饰 `program`；(B) `delivered` 是过去式 / 过去分词，常表「被送达的」，不符合「配送计划」这一项目名称；(C) `delivers` 是第三人称单数动词，不能放在名词前作定语。\n- 解题提示：名词前的空格不一定只填形容词。若要说明后面名词的类别或用途，应考虑“名词 + 名词”的复合名词。\n\n\n## #021 · Part 5 · cost-effective method for doing sth 表「做某事的高性价比方法」\n\n**添加日期**：2026-07-07\n\n> A researcher from Beckerton University has developed a cost-effective ___ for harnessing solar energy.\n> (A) method　(B) response　(C) biology　(D) excursion\n\n**译文**：Beckerton University 的一位研究人员开发了一种利用太阳能的高性价比方法。\n\n**答案**：A\n\n**解析**\n- 核心考点：空格前有 `a cost-effective`，后面有 `for harnessing solar energy` 说明用途，需要一个能表示「方法」的单数名词。\n- 句子结构：主语是 `A researcher from Beckerton University`，谓语是现在完成时 `has developed`，宾语是 `a cost-effective method`；`for harnessing solar energy` 后置修饰 `method`。\n- 语法知识：`a + 形容词 + 单数可数名词`；`method for doing sth` 中介词 `for` 后接动名词；现在完成时 `has developed` 强调研发成果已经完成并与现在相关。\n- 词汇与固定搭配：`researcher from a university` 来自大学的研究人员；`develop a method` 开发方法；`cost-effective method` 成本效益高的方法；`harness solar energy` 利用太阳能。\n- 正确项 A：`method` 表「方法」，`a cost-effective method for harnessing solar energy` 表示「一种利用太阳能的高性价比方法」。\n- 干扰项：(B) `response` 表「回应 / 反应」，不能和 `for harnessing solar energy` 自然搭配；(C) `biology` 表「生物学」，不是方法；(D) `excursion` 表「短途旅行 / 远足」，与太阳能利用无关。\n- 解题提示：先由冠词和形容词确定需要单数名词，再用后置的 `for doing` 判断名词语义和搭配。\n\n\n## #022 · Part 5 · be effective until 表「直到……才生效」\n\n**添加日期**：2026-07-07\n\n> Some changes to the company policy have been formally agreed upon, but they will not be ___ until next month.\n> (A) effect　(B) effective　(C) effects　(D) effectively\n\n**译文**：公司政策的一些变更已经正式达成一致，但它们要到下个月才会生效。\n\n**答案**：B\n\n**解析**\n- 核心考点：空格在 `be` 后作表语，说明主语 `they` 的状态，需要形容词。\n- 句子结构：第一分句主语是 `Some changes to the company policy`，谓语是现在完成时被动结构 `have been agreed upon`；`but` 连接第二分句，`they` 指代 `changes`，谓语部分是 `will not be effective until next month`。\n- 语法知识：系动词 `be` 后常接形容词作表语；`have been + 过去分词` 是现在完成时被动语态；`not ... until ...` 表“直到……才……”；代词 `they` 与复数先行词 `changes` 一致。\n- 词汇与固定搭配：`changes to the company policy` 公司政策变更；`be formally agreed upon` 被正式同意；`be effective` 生效；`until next month` 直到下个月。\n- 正确项 B：`effective` 是形容词，`will not be effective until next month` 表示「直到下个月才会生效」。\n- 干扰项：(A) `effect` 是名词，不能直接作 `be` 后的状态形容词；(C) `effects` 是复数名词，也不能作表语形容词；(D) `effectively` 是副词，不能作 `be` 后表语。\n- 解题提示：看到 `be + 空格` 先判断是否需要表语。若句意是说明政策或变更的状态，“生效的”应选形容词 `effective`。\n\n\n## #023 · Part 5 · optimistic forecasts 表「乐观预测」\n\n**添加日期**：2026-07-07\n\n> The fertilizer industry grew by 26 percent last year, which surpassed even the most ___ forecasts.\n> (A) optimist　(B) optimism　(C) optimistic　(D) optimistically\n\n**译文**：肥料行业去年增长了 26%，甚至超过了最乐观的预测。\n\n**答案**：C\n\n**解析**\n- 核心考点：空格在 `the most` 后、名词 `forecasts` 前，需要形容词构成 `the most + 形容词 + 名词`。\n- 句子结构：主句是 `The fertilizer industry grew by 26 percent last year`；`which surpassed even the most optimistic forecasts` 是非限制性定语从句，补充说明这一增长结果超过了预测。\n- 语法知识：`the most + 形容词 + 名词` 表最高程度；`grow by + 数值` 中 `by` 表变化幅度；非限制性定语从句可用 `which` 对前面的情况作补充说明。\n- 词汇与固定搭配：`fertilizer industry` 肥料行业；`grow by 26 percent` 增长 26%；`surpass forecasts` 超过预测；`optimistic forecast` 乐观预测。\n- 正确项 C：`optimistic` 是形容词，`the most optimistic forecasts` 表示「最乐观的预测」。\n- 干扰项：(A) `optimist` 是名词，表示乐观主义者；(B) `optimism` 是名词，表示乐观主义 / 乐观情绪；(D) `optimistically` 是副词，不能直接修饰名词 `forecasts`。\n- 解题提示：空格位于程度标记 `the most` 和名词之间，优先选择形容词；再用词尾识别 `-ic` 形容词形式。\n\n\n## #024 · Part 5 · rehearse a presentation 表「排练演示 / 发表」\n\n**添加日期**：2026-07-07\n\n> Mr. Salvador rehearsed his ___ in front of his colleagues to receive feedback.\n> (A) presentation　(B) president　(C) collection　(D) diploma\n\n**译文**：Salvador 先生在同事面前排练了他的演示，以便获得反馈。\n\n**答案**：A\n\n**解析**\n- 核心考点：根据 `rehearsed his ___` 和 `to receive feedback` 可知，空格需要一个能被排练、并适合让同事给反馈的名词。\n- 句子结构：主语是 `Mr. Salvador`，谓语是 `rehearsed`，宾语是 `his presentation`；`in front of his colleagues` 表地点和听众，`to receive feedback` 是目的状语。\n- 语法知识：形容词性物主代词 `his` 后接名词；不定式 `to receive` 表目的；`feedback` 是不可数名词，通常不加复数 `-s`。\n- 词汇与固定搭配：`rehearse a presentation` 排练演示；`in front of colleagues` 在同事面前；`receive feedback` 获得反馈；`colleague` 同事。\n- 正确项 A：`presentation` 表「演示 / 发表」，`rehearse a presentation` 是商务、会议和培训场景中的自然搭配。\n- 干扰项：(B) `president` 表「总裁 / 主席」，是人，不能作为被 `rehearse` 的内容；(C) `collection` 表「收藏 / 系列」，不符合从同事那里获得反馈的语境；(D) `diploma` 表「文凭」，不能被排练。\n- 解题提示：词义题要联合动词和目的状语判断。能被 `rehearse` 且能获得反馈的内容只能是 `presentation`。\n\n\n## #025 · Part 5 · enthusiasm for 表「对……的热情」\n\n**添加日期**：2026-07-07\n\n> Ms. Cho’s ___ for oil painting is shown in a book she is writing about local artwork.\n> (A) enthusiastic　(B) enthusiastically　(C) enthusiast　(D) enthusiasm\n\n**译文**：Cho 女士对油画的热情体现在她正在写的一本关于当地艺术作品的书中。\n\n**答案**：D\n\n**解析**\n- 核心考点：空格前是所有格 `Ms. Cho’s`，后面有介词短语 `for oil painting` 修饰该名词，整句主语需要一个抽象名词作中心词。\n- 句子结构：主语是 `Ms. Cho’s enthusiasm for oil painting`，谓语是被动结构 `is shown`；`in a book` 表呈现载体，`she is writing about local artwork` 是省略关系代词的定语从句，修饰 `book`。\n- 语法知识：所有格后接名词构成名词短语；`enthusiasm for + 名词` 中 `for` 引出热情对象；`is shown` 是一般现在时被动语态；关系代词作 `writing` 的宾语时可以省略，完整形式为 `a book that she is writing`。\n- 词汇与固定搭配：`enthusiasm for oil painting` 对油画的热情；`be shown in a book` 在书中体现；`write about` 撰写关于……的内容；`local artwork` 当地艺术作品。\n- 正确项 D：`enthusiasm` 是名词，`enthusiasm for oil painting` 表示「对油画的热情」，能作句子主语。\n- 干扰项：(A) `enthusiastic` 是形容词，不能直接放在所有格后作主语名词；(B) `enthusiastically` 是副词，不能作名词；(C) `enthusiast` 是表示人的名词，指热衷者，放入句中会变成「Cho 女士的热衷者」，语义不通。\n- 解题提示：所有格后通常需要名词，但还要区分“人”和“抽象概念”；`for oil painting` 要表达的是热情的对象，因此选 `enthusiasm`。\n\n\n## #026 · Part 5 · 非限制性定语从句用 which 指物\n\n**添加日期**：2026-07-08\n\n> The managerial role, ___ was previously done by David Copper, will be taken over by Sharon Wells as early as next month.\n> (A) whoever　(B) who　(C) which　(D) whichever\n\n**译文**：这个管理职位此前由 David Copper 担任，最早下个月将由 Sharon Wells 接手。\n\n**答案**：C\n\n**解析**\n- 核心考点：逗号之间是非限制性定语从句，先行词是 `The managerial role`，表示职位 / 事情，不是人，需要能指物或事的关系代词。\n- 句子结构：主句主语是 `The managerial role`，谓语是将来时被动结构 `will be taken over`；`which was previously done by David Copper` 是非限制性定语从句，`by Sharon Wells` 表接手者，`as early as next month` 表最早时间。\n- 语法知识：非限制性定语从句用逗号隔开，指物或事用 `which`，且关系代词不能省略；`will be + 过去分词` 是一般将来时被动语态；`by + 人` 标明动作执行者。\n- 词汇与固定搭配：`managerial role` 管理职位或职责；`previously` 先前；`be taken over by` 由……接手；`as early as next month` 最早下个月。\n- 正确项 C：`which` 可引导非限制性定语从句并指代前面的名词短语，`which was previously done by David Copper` 补充说明这个职位此前由谁承担。\n- 干扰项：(A) `whoever` 表「无论谁 / 任何人」，不用于指代前面的职位；(B) `who` 指人，不能指 `role`；(D) `whichever` 表「无论哪一个」，需要选择范围，不适合引导这里的补充说明从句。\n- 解题提示：先找先行词，再判断人或物；逗号表明是非限制性定语从句，指物时直接选 `which`。\n\n\n## #027 · Part 5 · in a courteous manner 表「以礼貌的方式」\n\n**添加日期**：2026-07-08\n\n> The new receptionist at Clarwell Insurance is always friendly and welcomes every customer in a ___ manner.\n> (A) courtesy　(B) courtesies　(C) courteously　(D) courteous\n\n**译文**：Clarwell Insurance 的新接待员总是很友好，并以礼貌的方式欢迎每一位顾客。\n\n**答案**：D\n\n**解析**\n- 核心考点：空格位于 `a` 和名词 `manner` 之间，需要形容词修饰名词，构成 `in a + 形容词 + manner`。\n- 句子结构：主语是 `The new receptionist at Clarwell Insurance`；并列谓语是 `is` 和 `welcomes`，表语是 `friendly`，宾语是 `every customer`，`in a courteous manner` 是方式状语。\n- 语法知识：`and` 连接同一主语的两个谓语；系动词 `is` 后接形容词作表语；`a + 形容词 + 名词` 中形容词修饰中心名词；`every + 单数可数名词`。\n- 词汇与固定搭配：`receptionist` 接待员；`welcome every customer` 欢迎每位顾客；`in a courteous manner` 以礼貌的方式；`friendly` 友好的。\n- 正确项 D：`courteous` 是形容词，`in a courteous manner` 表示「以礼貌的方式」，和前面的 `friendly` 语义一致。\n- 干扰项：(A) `courtesy` 是名词，不能放在 `a` 和 `manner` 之间修饰名词；(B) `courtesies` 是复数名词，也不能作形容词；(C) `courteously` 是副词，通常修饰动词，如 `welcomes customers courteously`，不能直接修饰 `manner`。\n- 解题提示：不要被整个短语作方式状语迷惑。空格直接修饰的是名词 `manner`，所以仍要使用形容词。\n\n\n## #028 · Part 5 · 形容词性物主代词 her 修饰名词\n\n**添加日期**：2026-07-08\n\n> Samantha Nighting will release ___ first solo album later this year.\n> (A) herself　(B) she　(C) hers　(D) her\n\n**译文**：Samantha Nighting 将在今年晚些时候发行她的首张个人专辑。\n\n**答案**：D\n\n**解析**\n- 核心考点：空格后是名词短语 `first solo album`，需要能放在名词前作限定词的形容词性物主代词。\n- 句子结构：主语是 `Samantha Nighting`，谓语是一般将来时 `will release`，宾语是 `her first solo album`，`later this year` 是时间状语。\n- 语法知识：形容词性物主代词直接放在名词前，如 `her album`；名词性物主代词不能再接名词；情态性质的助动词 `will` 后接动词原形；序数词 `first` 位于名词前。\n- 词汇与固定搭配：`release an album` 发行专辑；`first solo album` 首张个人专辑；`later this year` 今年晚些时候。\n- 正确项 D：`her` 可作形容词性物主代词，修饰 `first solo album`，表示「她的首张个人专辑」。\n- 干扰项：(A) `herself` 是反身代词，不能修饰名词；(B) `she` 是主格代词，通常作主语，不能放在名词前；(C) `hers` 是名词性物主代词，相当于「她的东西」，后面不能再接名词。\n- 解题提示：空格后已有名词时，应选择能作限定词的 `her`；`hers` 本身已经代替“her + 名词”。\n\n\n## #029 · Part 5 · reliably predicts 表「可靠地预测」\n\n**添加日期**：2026-07-08\n\n> Our new weather simulation software ___ predicts storms up to two weeks before they occur.\n> (A) rely　(B) reliable　(C) reliably　(D) reliability\n\n**译文**：我们的新天气模拟软件能在风暴发生前最多两周可靠地预测风暴。\n\n**答案**：C\n\n**解析**\n- 核心考点：空格位于主语 `Our new weather simulation software` 和谓语动词 `predicts` 之间，需要副词修饰动词，说明预测方式或可靠程度。\n- 句子结构：主语是 `Our new weather simulation software`，谓语是 `predicts`，宾语是 `storms`；`reliably` 修饰谓语，`up to two weeks before they occur` 表可提前预测的时间。\n- 语法知识：副词修饰实义动词；不可数名词 `software` 作单数主语，因此谓语用 `predicts`；`before they occur` 是时间状语从句，`they` 指代复数 `storms`。\n- 词汇与固定搭配：`weather simulation software` 天气模拟软件；`reliably predict storms` 可靠地预测风暴；`up to two weeks before` 最多提前两周；`occur` 发生。\n- 正确项 C：`reliably` 是副词，`reliably predicts storms` 表示「可靠地预测风暴」。\n- 干扰项：(A) `rely` 是动词原形，不能修饰另一个谓语动词；(B) `reliable` 是形容词，可修饰名词但不能直接修饰 `predicts`；(D) `reliability` 是名词，不能放在动词前作副词。\n- 解题提示：空格紧邻谓语动词并回答“如何预测”时，需要副词；可通过 `-ly` 词尾快速定位，再验证语义。\n\n\n## #030 · Part 5 · extended hours of operation 表「延长营业时间」\n\n**添加日期**：2026-07-08\n\n> To handle the additional customers during the summer, our store will have ___ hours of operation.\n> (A) extended　(B) affordable　(C) necessary　(D) immediate\n\n**译文**：为了应对夏季增加的顾客，我们的商店将延长营业时间。\n\n**答案**：A\n\n**解析**\n- 核心考点：空格修饰名词短语 `hours of operation`，需要一个能说明营业时间被加长的形容词。\n- 句子结构：`To handle the additional customers during the summer` 是目的状语；主语是 `our store`，谓语是 `will have`，宾语是 `extended hours of operation`。\n- 语法知识：句首不定式 `to handle` 表目的；过去分词 `extended` 可形容已经被延长的时间；`will + 动词原形` 构成一般将来时；`during + 名词短语` 表某段期间。\n- 词汇与固定搭配：`handle additional customers` 应对增加的顾客；`during the summer` 夏季期间；`extended hours of operation` 延长的营业时间；`hours of operation` 营业时间。\n- 正确项 A：`extended` 表「延长的」，`extended hours of operation` 是零售、服务行业常见表达，表示营业时间延长。\n- 干扰项：(B) `affordable` 表「负担得起的」，通常修饰价格、商品或服务；(C) `necessary` 表「必要的」，不能自然说明营业时间因客流增加而延长；(D) `immediate` 表「立即的 / 即刻的」，不修饰 `hours of operation` 表营业安排。\n- 解题提示：结合句首目的“应对更多顾客”，营业安排应发生延长；形容词题要同时检查语义因果和固定搭配。\n\n\n## #031 · Part 5 · when 引导时间状语从句\n\n**添加日期**：2026-07-28\n\n> Mr. Patel will be leaving work early today to pick up the clients ___ they arrive at the airport.\n> (A) during　(B) just　(C) regarding　(D) when\n\n**译文**：Patel 先生今天将提前下班，以便在客户抵达机场时接他们。\n\n**答案**：D\n\n**解析**\n- 核心考点：空格后是完整句子 `they arrive at the airport`，需要连词引导时间状语从句，说明接客户的时间。\n- 句子结构：主语是 `Mr. Patel`，谓语是将来进行时 `will be leaving`；`work` 是 `leave` 的宾语，`early today` 是时间状语；`to pick up the clients` 表目的，`when they arrive at the airport` 是时间状语从句。\n- 语法知识：`will be doing` 表将来某时的安排或正在进行的动作；时间状语从句谈将来时通常用一般现在时，即主句用将来时、`when` 从句用 `arrive`；`they` 指代 `clients`。\n- 词汇与固定搭配：`leave work early` 提前下班；`pick up the clients` 接客户；`arrive at the airport` 抵达机场；`today` 今天。\n- 正确项 D：`when` 可引导时间状语从句，表示「当……时」；主句用将来进行时 `will be leaving`，时间从句用一般现在时 `arrive` 表将来。\n- 干扰项：(A) `during` 是介词，后接名词或名词短语，不能直接接完整句子；(B) `just` 是副词，不能连接主句和从句；(C) `regarding` 是介词，表示「关于」，既不能引导该从句，语义也不合。\n- 解题提示：先确认空格后是“主语 + 谓语”的完整句子，因此需要连词；再根据两个动作的时间关系选择 `when`。\n\n\n## #032 · Part 5 · 副词 perfectly 修饰动词 match\n\n**添加日期**：2026-07-29\n\n> The newspaper recently employed an interior designer to match the drapes and wallpaper ___ with the antique desk in the editor’s office.\n> (A) perfect　(B) perfected　(C) perfectly　(D) perfection\n\n**译文**：这家报社最近聘请了一名室内设计师，使窗帘和墙纸与编辑办公室里的古董书桌完美搭配。\n\n**答案**：C\n\n**解析**\n- 核心考点：空格修饰动词 `match`，说明窗帘和墙纸与书桌搭配得如何，需要副词。\n- 句子结构：主语是 `The newspaper`，谓语是 `employed`，宾语是 `an interior designer`；不定式 `to match ...` 说明聘用目的，`perfectly` 修饰 `match`，`in the editor’s office` 修饰 `desk`。\n- 语法知识：副词修饰实义动词并说明动作方式；`employ sb to do sth` 表雇用某人做某事；`match A with B` 表使 A 与 B 相配；`the editor’s` 是所有格，修饰 `office`。\n- 词汇与固定搭配：`employ an interior designer` 聘请室内设计师；`drapes and wallpaper` 窗帘和墙纸；`match ... perfectly with ...` 与……完美搭配；`antique desk` 古董书桌；`editor’s office` 编辑办公室。\n- 正确项 C：`perfectly` 是副词，`match ... perfectly with ...` 表示「与……完美搭配」。\n- 干扰项：(A) `perfect` 是形容词，不能直接修饰动词 `match`；(B) `perfected` 是过去式或过去分词，放在这里无法充当方式状语；(D) `perfection` 是名词，不能修饰动词。\n- 解题提示：确定句子已有完整谓语和不定式动词后，空格只是说明 `match` 的方式，因此选择副词形式 `perfectly`。\n"}, {"name": "02_高频词汇.md", "label": "02 高频词汇", "md": "# 02 高频词汇\n\n单词的词性、释义、来自题目的例句，以及易混词提示。已记过的词只在「易混词 / 提示」或例句列补充，不重复建行。\n\n| 单词 | 词性 | 释义 | 题中例句（英文原文） | 易混词 / 提示 |\n|------|------|------|----------------------|----------------|\n| business day | n. | 工作日（不含周末与节假日） | at least ten business days prior to the scheduled session | 不是「商务日」；表期限常与 prior to / before / after 搭配 |\n| rapid | adj. | 快速的，迅速的 | has seen rapid expansion in East Asia | 常修饰 expansion / growth / change 等表示发展变化的名词；本题不能用 bright |\n| expansion | n. | 扩张，扩大，发展 | rapid expansion in East Asia | 商业语境常指市场、业务、门店、地区覆盖的扩大 |\n| popularity | n. | 受欢迎，流行 | due to the popularity of its clothing lines | `due to + 名词` 表原因；popularity 说明扩张原因，不决定选 bright |\n| consecutive | adj. | 连续的，接连的 | After several consecutive days of delays due to bad weather | 常修饰 days / years / wins 等表数量或时间的名词 |\n| delay | n./v. | 延误，推迟 | several consecutive days of delays due to bad weather；the city’s subway system is experiencing delays | 作名词时可数，常用复数 delays 表多处 / 多次延误；作动词时搭配 delay doing |\n| professional | n./adj. | 专业人士；专业的 | are active professionals who have worked in the industry for many years | 作名词指有专业技能或从业经验的人；本题用复数 professionals |\n| industry | n. | 行业，产业 | worked in the industry for many years | `the industry` 指前文语境中的行业；常与 work in 搭配 |\n| saw | n. | 锯 | Our new electric saw is so powerful | `electric saw` 是电锯；不要误看成 see 的过去式 saw |\n| powerful | adj. | 强劲的，功率大的 | so powerful that it can cut sheets of metal | 产品性能语境中常形容机器、工具、设备能力强 |\n| metal | n. | 金属 | sheets of metal up to one centimeter thick | `sheets of metal` 指金属板 / 金属片 |\n| financial | adj. | 财务的，金融的 | The Langdon Company’s financial specialist | 常修饰 report / decision / specialist / department 等财务相关名词 |\n| specialist | n. | 专员，专家 | financial specialist, Richard Bigsby | 表示具有专门职责或专业知识的人；词尾 `-ist` 常指人 |\n| budgetary | adj. | 预算的 | handles all budgetary decisions | 常修饰 decisions / constraints / planning 等预算相关名词 |\n| announce | v. | 宣布，告知 | is excited to announce that this month’s guest speaker is Joshua Ramsey | 后面常接 `that + 句子` 表宣布的内容 |\n| guest speaker | n. | 嘉宾演讲者，特邀讲者 | this month’s guest speaker is Joshua Ramsey | 学校、会议、活动通知中的常见表达 |\n| expert | n./adj. | 专家；熟练的 | an expert in climate science | 作名词指人，是可数名词；本题受 `an` 限定用单数 |\n| expertise | n. | 专业知识，专长 | —（本题干扰项 A） | 不可数抽象名词，不指专家本人；不能写成 `an expertise in ...` |\n| environmental | adj. | 环境的，环保的 | a new environmental agency | 常修饰 agency / policy / issue / impact 等环境相关名词 |\n| agency | n. | 机构，部门 | a new environmental agency established to address the city’s pollution problem | 可指政府、公共或专业机构 |\n| establish | v. | 成立，建立 | a new environmental agency established to address the city’s pollution problem | 本题用过去分词 `established` 作后置定语，表示被成立 |\n| pollution | n. | 污染 | the city’s pollution problem | 不可数名词；作定语时可用于 `pollution problem` |\n| employee | n. | 员工，雇员 | Each employee is expected to use their designated parking space | 指受雇于公司的人员，区别于 employer「雇主」 |\n| designate | v. | 指定，选定 | their designated parking space | 本题用过去分词 `designated` 作形容词，表示「被指定的」 |\n| parking space | n. | 停车位 | designated parking space | 也可说 parking spot；公司场景常涉及员工停车位 |\n| trend | n. | 趋势，走向 | The current upward trend in sales | 常与 upward / downward / current 搭配，表示数据变化方向 |\n| upward | adj. | 向上的，上升的 | upward trend in sales | 常修饰 trend / movement，表示数据或数量上升 |\n| sales | n. | 销售额，销售 | upward trend in sales | 商务语境中常指销售额或销售表现 |\n| upcoming | adj. | 即将到来的 | the upcoming holiday season | 常修饰 event / meeting / season / launch 等 |\n| mattress | n. | 床垫 | Jackson Bedding’s mattress lines | `mattress lines` 指床垫产品线，`line` 在商务语境中可指产品系列 |\n| material | n. | 材料，原料 | particularly soft materials they use | 复数 `materials` 常指产品使用的多种材料或原料 |\n| soft | adj. | 柔软的 | particularly soft materials | 形容词修饰名词；前面可由程度副词 `particularly` 加强 |\n| particularly | adv. | 尤其，特别 | particularly soft materials | 副词修饰形容词 `soft`，不能直接修饰名词 `materials` |\n| annex | n. | 附属建筑，附加部分 | A new annex, which will expand the Bayview Mall | 商业建筑语境中常指为扩大原有设施而新增的附属楼或扩建部分 |\n| expand | v. | 扩大，扩建 | which will expand the Bayview Mall | 可指业务、市场、建筑空间等扩大；本题指商场扩建 |\n| construction | n. | 建设，施工 | currently under construction | 常用于固定表达 `under construction`，表示正在建设中 |\n| train service | n. | 列车服务 | Train service to and from the Luzern District | 交通公告中常说明服务范围、暂停、延误或恢复 |\n| suspend | v. | 暂停，中止 | will be temporarily suspended | 常用被动 `be suspended` 表服务、活动、运营被暂停 |\n| temporarily | adv. | 暂时地 | temporarily suspended | 修饰 `suspended`，说明暂停是临时状态，不是永久取消 |\n| repair | n./v. | 维修，修理 | while repairs are being made | 名词常用复数 `repairs` 表维修工作；`repairs are being made` 表维修正在进行 |\n| praise | v. | 称赞，表扬 | praised Ms. Fong for producing such an innovative advertising campaign | 常用 `praise sb for doing sth` 表因某事称赞某人 |\n| produce | v. | 制作，产出 | producing such an innovative advertising campaign | 可指制作广告、报告、产品或内容 |\n| innovative | adj. | 创新的 | such an innovative advertising campaign | 形容词修饰名词；词尾 `-ive` 常构成形容词 |\n| advertising campaign | n. | 广告活动，广告宣传 | an innovative advertising campaign for the new line of televisions | 营销语境常指围绕某产品或品牌的一系列广告活动 |\n| fair | n. | 展会，博览会 | At the Food & Beverage Fair | 商务场景中常指行业展会或商品展示活动 |\n| opportunity | n. | 机会 | many opportunities to sample products | 可数名词；复数前可用 `many`，不能用 `every` |\n| sample | v. | 试吃，试用，体验样品 | sample products | 展会、食品饮料、零售推广语境中常表示试用或试吃产品 |\n| product | n. | 产品 | sample products | 商务和营销语境高频词；复数 `products` 表多种产品 |\n| regard | v. | 认为，看作 | is regarded as one of the most influential modern authors | 常用被动 `be regarded as` 表「被视为」 |\n| influential | adj. | 有影响力的 | one of the most influential modern authors | 常修饰 person / author / figure / leader 等，表示影响力大 |\n| author | n. | 作者，作家 | modern authors | 可数名词；`one of ...` 后接复数名词 |\n| delivery | n. | 配送，递送 | same-day delivery program | 名词作定语修饰 `program`，表示计划类型 |\n| program | n. | 计划，项目 | Bigmart’s same-day delivery program | 商务语境中可指公司推出的服务项目、计划或活动 |\n| market | n. | 市场，地区市场 | select markets last fall | `select markets` 指经过选择的部分市场 / 地区 |\n| researcher | n. | 研究人员 | A researcher from Beckerton University | 指从事研究的人；常与 university / institute 搭配 |\n| cost-effective | adj. | 成本效益高的，高性价比的 | a cost-effective method for harnessing solar energy | 常修饰 method / solution / approach / strategy |\n| method | n. | 方法 | a cost-effective method for harnessing solar energy | 常接 `for doing sth` 表做某事的方法 |\n| harness | v. | 利用，开发利用 | harnessing solar energy | 常用于能源语境，表示把自然资源转化为可用能源 |\n| solar energy | n. | 太阳能 | harnessing solar energy | 可作能源技术、环保项目语境表达 |\n| policy | n. | 政策，规定 | changes to the company policy | 公司制度、政策变更语境常用 |\n| formally | adv. | 正式地 | have been formally agreed upon | 修饰动作，表示通过正式程序或方式 |\n| effective | adj. | 生效的；有效的 | will not be effective until next month | 作表语时可表示规定、政策、变更开始生效 |\n| fertilizer | n. | 肥料 | The fertilizer industry | 农业、化工行业语境常用 |\n| surpass | v. | 超过，胜过 | surpassed even the most optimistic forecasts | 可接 forecast / expectation / target 等，表示超过预期或预测 |\n| forecast | n./v. | 预测，预报 | the most optimistic forecasts | 作名词时可数；商业、行业、天气语境常用 |\n| optimistic | adj. | 乐观的 | the most optimistic forecasts | 形容词修饰预测、估计、观点等 |\n| rehearse | v. | 排练，预演 | rehearsed his presentation | 后接演示、演讲、表演等内容；商务场景常指正式发表前预演 |\n| presentation | n. | 演示，发表，报告 | rehearsed his presentation | 可数名词；会议、培训、销售场景中常指面向听众的正式说明 |\n| colleague | n. | 同事 | in front of his colleagues | 可数名词；强调一起工作的人，不等同于 friend |\n| feedback | n. | 反馈，意见 | to receive feedback | 不可数名词；常和 receive / give / provide 搭配 |\n| enthusiasm | n. | 热情，热忱 | Ms. Cho’s enthusiasm for oil painting | 抽象名词；常和 `for` 搭配，表示对某事的热情 |\n| enthusiastic | adj. | 热情的，热衷的 | —（本题干扰项 A） | 形容词常用于 `be enthusiastic about ...`，不能直接作所有格后的中心名词 |\n| enthusiast | n. | 热衷者，爱好者 | —（本题干扰项 C） | 指人；不等于抽象名词「热情」 |\n| oil painting | n. | 油画 | for oil painting | 可指油画这种艺术形式，也可指一幅油画 |\n| artwork | n. | 艺术作品 | local artwork | 集合意义时常作不可数名词，表示艺术作品整体 |\n| managerial | adj. | 管理的，经理的 | The managerial role | 常修饰 role / position / responsibility 等，表示管理职责相关 |\n| role | n. | 角色，职位，职责 | The managerial role | 商务语境中可指岗位职责或职务角色 |\n| previously | adv. | 以前，先前 | was previously done by David Copper | 修饰动词，说明某事过去由谁完成或负责 |\n| take over | phr.v. | 接管，接手 | will be taken over by Sharon Wells | 常用于职务、项目、业务、责任的交接 |\n| receptionist | n. | 接待员，前台 | The new receptionist at Clarwell Insurance | 公司、酒店、诊所等场景中负责接待客户或访客的人 |\n| insurance | n. | 保险；保险业 | Clarwell Insurance | 公司名中常指保险公司或保险业务 |\n| friendly | adj. | 友好的 | is always friendly | 服务场景中常形容员工态度 |\n| welcome | v. | 欢迎，迎接 | welcomes every customer | 可直接接顾客、访客等宾语 |\n| customer | n. | 顾客，客户 | every customer | 服务、零售、保险等商业场景高频词 |\n| courteous | adj. | 礼貌的，谦恭的 | in a courteous manner | 形容词，常修饰 manner / service / staff 等 |\n| courtesy | n. | 礼貌，礼仪 | —（本题干扰项 A） | 名词；不能放在 `a` 和 `manner` 之间作形容词 |\n| manner | n. | 方式，态度，举止 | in a courteous manner | `in a ... manner` 表「以……方式」 |\n| release | v. | 发行，发布 | will release her first solo album | 可用于专辑、产品、报告、电影等发布 |\n| solo album | n. | 个人专辑 | her first solo album | 音乐场景中指歌手个人名义发行的专辑 |\n| weather simulation software | n. | 天气模拟软件 | Our new weather simulation software | 技术和气象语境中用于模拟、预测天气系统的软件 |\n| predict | v. | 预测，预报 | reliably predicts storms | 可接 weather / storm / demand / trend 等，表示预测未来情况 |\n| storm | n. | 风暴，暴风雨 | predicts storms | 可数名词；天气预报语境高频词 |\n| reliable | adj. | 可靠的 | —（本题干扰项 B） | 形容词，可修饰名词，如 reliable software / reliable forecast |\n| reliably | adv. | 可靠地 | reliably predicts storms | 副词，修饰动词 `predicts` |\n| reliability | n. | 可靠性 | —（本题干扰项 D） | 抽象名词，不用于直接修饰动词 |\n| handle | v. | 处理，应对 | To handle the additional customers | 可接 customers / requests / problems / decisions，表示处理或应对 |\n| additional | adj. | 额外的，增加的 | additional customers during the summer | 修饰新增数量或额外需求 |\n| extended | adj. | 延长的，扩展的 | extended hours of operation | 常修饰 hours / period / deadline 等，表示时间被拉长 |\n| hours of operation | n. | 营业时间 | hours of operation | 商店、机构、服务窗口说明开放时间的常用表达 |\n| affordable | adj. | 负担得起的 | —（本题干扰项 B） | 常修饰 price / housing / service，不修饰营业时间 |\n| necessary | adj. | 必要的 | —（本题干扰项 C） | 表需要或必要性，不表示延长 |\n| immediate | adj. | 立即的，即刻的 | —（本题干扰项 D） | 常修饰 response / action / effect，不自然修饰营业时间 |\n| client | n. | 客户，委托人 | to pick up the clients | 商务语境中常指接受专业服务或与公司有业务关系的客户 |\n| airport | n. | 机场 | they arrive at the airport | 常和 `arrive at`、`pick up` 等表达搭配，出现在商务差旅和接待场景 |\n| interior designer | n. | 室内设计师 | employed an interior designer | 负责室内空间布局、装饰和配色的专业人员 |\n| drape | n. | 窗帘，帷帘 | the drapes and wallpaper | 本题用复数 `drapes`，与墙纸、家具共同构成室内装饰 |\n| wallpaper | n. | 墙纸，壁纸 | the drapes and wallpaper | 通常作不可数名词；室内设计语境中常与颜色、窗帘和家具搭配 |\n| antique | adj./n. | 古董的；古董 | the antique desk | 本题作形容词修饰 `desk`，表示具有年代和收藏价值的 |\n| perfectly | adv. | 完美地，完全地 | match the drapes and wallpaper perfectly with the antique desk | 副词形式，修饰动词 `match`，说明搭配效果 |\n"}, {"name": "03_固定搭配.md", "label": "03 固定搭配", "md": "# 03 固定搭配\n\n动词与介词的搭配、固定短语。介词是 Part 5 高频考点，重点记「哪个词配哪个介词」。\n\n| 搭配 / 短语 | 含义 | 题中例句（英文原文） | 备注 |\n|-------------|------|----------------------|------|\n| prior to + 名词 | 在……之前（= before） | ten business days prior to the scheduled session | 介词短语，后接名词；Part 5 常用它替换 before |\n| in case / in case of | in case + 句子、in case of + 名词：以防、万一 | —（本题干扰项 A） | 是连词 / 介词短语，义为「以防」，与「之前」无关，别和 prior to 混 |\n| rapid expansion | 快速扩张 | has seen rapid expansion in East Asia | 形容词 + 名词搭配；说扩张速度快，不用 bright / loud / proud |\n| due to + 名词 | 由于，因为 | due to the popularity of its clothing lines；Due to the heavy rain this morning | `due to` 后接名词或名词短语；如果后面是完整句子才用 because / while 等连词 |\n| put + 宾语 + first | 把……放在首位，优先考虑…… | put quality service and customer care first | 商务服务理念常用表达；`first` 表优先级 |\n| suggest doing sth | 建议做某事（suggest 后接动名词，不接 to do） | the director suggested filming the scene inside the studio | filming 是 suggest 的动名词宾语 |\n| work in the industry | 在该行业工作 | have worked in the industry for many years | `industry` 前用 `the` 指特定行业；现在完成时强调经验延续到现在 |\n| heavy rain | 大雨 | the heavy rain this morning | `heavy` 可修饰 rain / traffic / workload 等，表示程度大 |\n| experience delays | 出现 / 遭遇延误 | the city’s subway system is experiencing delays | 交通、物流、项目进度场景常用；主语通常是系统、航班、服务或项目 |\n| so + adj. + that + 句子 | 如此……以至于…… | so powerful that it can cut sheets of metal | `so` 修饰形容词 / 副词，`that` 后接结果句 |\n| up to + 数量 | 多达，最高达到 | up to one centimeter thick | 用于说明上限、规格或能力范围 |\n| financial specialist | 财务专员 / 财务专家 | financial specialist, Richard Bigsby | `financial` 修饰表示人的职位名词 `specialist` |\n| handle budgetary decisions | 处理预算决策 | handles all budgetary decisions | `handle` 可表示负责处理事务、决策、问题 |\n| be excited to announce that + 句子 | 很高兴宣布…… | is excited to announce that this month’s guest speaker is Joshua Ramsey | 公告、活动通知常用开头，`that` 后接完整句子 |\n| expert in + 领域 | 某领域的专家 | an expert in climate science | `expert` 指人；`in` 后接专业领域 |\n| environmental agency | 环保机构，环境机构 | a new environmental agency | `environmental` 修饰机构类型 |\n| be established to do sth | 被成立来做某事 | a new environmental agency established to address the city’s pollution problem | 常用过去分词 `established` 后接不定式表目的 |\n| address a problem | 处理 / 解决问题 | address the city’s pollution problem | `address` 在商务和公共事务语境中常表示着手处理问题 |\n| be expected to do sth | 被期望 / 应该做某事 | Each employee is expected to use their designated parking space | 规章、通知、岗位要求中常用，语气比 must 稍缓 |\n| designated parking space | 指定停车位 | their designated parking space | `designated` 作形容词，说明停车位已被分配或指定 |\n| upward trend in sales | 销售额上升趋势 | The current upward trend in sales | `in sales` 说明趋势发生在销售数据上 |\n| be likely to do sth | 很可能做某事 | is likely to continue through the upcoming holiday season | `likely` 后接不定式，表示可能性 |\n| continue through + 时间段 | 持续贯穿某段时间 | continue through the upcoming holiday season | `through` 接时间段，强调一直持续到该期间结束 |\n| be praised for + 名词 / 名词短语 | 因……受到称赞 | have been praised for the particularly soft materials they use | `for` 后接受到称赞的原因 |\n| particularly soft materials | 特别柔软的材料 | particularly soft materials they use | `particularly` 修饰形容词 `soft`，`soft` 再修饰名词 `materials` |\n| under construction | 正在建设中 / 施工中 | is currently under construction | `under + 名词` 表状态；建筑、道路、设施项目常用 `construction` |\n| temporarily suspended | 暂时暂停 | will be temporarily suspended | 公共服务、交通、活动通知中常用；强调暂停是临时的 |\n| while repairs are being made | 在维修进行期间 | while repairs are being made | `while` 引导时间状语从句，`are being made` 表维修正在进行 |\n| praise sb for doing sth | 因做某事称赞某人 | praised Ms. Fong for producing such an innovative advertising campaign | `for` 后接名词或动名词，说明称赞原因 |\n| innovative advertising campaign | 创新的广告活动 | an innovative advertising campaign | 形容词 `innovative` 修饰营销活动 |\n| line of + 产品 | ……产品线 / 系列产品 | the new line of televisions | 商务语境中 `line` 常指一组同类产品 |\n| many opportunities to do sth | 许多做某事的机会 | many opportunities to sample products and learn how they are made | `opportunities` 是复数可数名词，前面直接用 `many` |\n| sample products | 试吃 / 试用产品 | sample products | 展会、门店推广和产品发布场景常用 |\n| learn how + 句子 | 了解如何…… | learn how they are made | `how` 后接完整句子，说明要了解的制作方式 |\n| be regarded as | 被视为，被认为是 | is regarded as one of the most influential modern authors | 被动结构；主语是被评价的人或事物 |\n| one of the most + 形容词 + 复数名词 | 最……的……之一 | one of the most influential modern authors | `one of` 后面的名词要用复数 |\n| participate in | 参与，参加 | was already participating in Bigmart’s same-day delivery program | 后接活动、计划、项目等名词 |\n| same-day delivery program | 当日配送计划 | Bigmart’s same-day delivery program | `delivery` 是名词作定语，说明计划类型 |\n| select markets | 部分选定市场 | began in select markets last fall | `select` 作形容词，表示经过选择的、精选的 |\n| method for doing sth | 做某事的方法 | a cost-effective method for harnessing solar energy | `for` 后接动名词，说明方法用途 |\n| harness solar energy | 利用太阳能 | harnessing solar energy | 能源技术语境常用 `harness` 表开发利用 |\n| be agreed upon | 被同意 / 达成一致 | have been formally agreed upon | 被动结构；常用于协议、政策、变更等已经达成一致 |\n| be effective until + 时间 | 到……才生效 / 有效至…… | will not be effective until next month | 否定句中 `not ... until` 表「直到……才……」 |\n| grow by + 百分比 | 增长了…… | grew by 26 percent last year | `by` 后接增长幅度 |\n| surpass forecasts | 超过预测 | surpassed even the most optimistic forecasts | 表实际结果超过预期或预测 |\n| the most optimistic forecasts | 最乐观的预测 | the most optimistic forecasts | `optimistic` 修饰复数名词 `forecasts` |\n| rehearse a presentation | 排练演示 / 发表 | rehearsed his presentation | 正式汇报、会议发言或销售展示前常用 |\n| in front of + 人 | 在某人面前 | in front of his colleagues | 说明动作发生在听众或观察者面前 |\n| receive feedback | 获得反馈 | to receive feedback | `feedback` 常作不可数名词，动词可用 receive / get / provide / give |\n| enthusiasm for + 名词 | 对……的热情 | Ms. Cho’s enthusiasm for oil painting | `for` 后接热情所指向的对象；不要误用表示人的 `enthusiast` |\n| managerial role | 管理职位 / 管理职责 | The managerial role | `role` 在商务语境中常指岗位职责，不只是“角色” |\n| be taken over by | 被……接手 / 接管 | will be taken over by Sharon Wells | 被动结构，说明职责、职位或项目转交给某人 |\n| as early as + 时间 | 最早在…… | as early as next month | 表示某事可能发生的最早时间点 |\n| in a courteous manner | 以礼貌的方式 | in a courteous manner | `manner` 前用形容词，不能用副词 `courteously` |\n| welcome customers | 欢迎 / 接待顾客 | welcomes every customer | 接待、客服、门店服务场景常用 |\n| release an album | 发行专辑 | will release her first solo album | 音乐、娱乐和媒体公告常用 |\n| later this year | 今年晚些时候 | later this year | 表示同一年内较晚的时间 |\n| predict storms | 预测风暴 | predicts storms | 天气预报、气象技术语境常用 |\n| up to + 时间 / 数量 | 最多达…… | up to two weeks before they occur | 表示上限；可接时间、数量或程度 |\n| handle additional customers | 应对增加的顾客 | To handle the additional customers | `handle` 表处理、应对，宾语可为顾客、需求、问题 |\n| extended hours of operation | 延长营业时间 | extended hours of operation | 零售、餐饮、服务行业常用；`extended` 修饰营业时间 |\n| leave work early | 提前下班 | will be leaving work early today | `leave work` 表下班离开工作地点，`early` 说明早于正常时间 |\n| pick up + 人 | 接某人 | to pick up the clients | 指开车或前往某地接人；商务差旅中常用于机场接待 |\n| arrive at + 小地点 | 到达某地 | they arrive at the airport | `arrive at` 接机场、车站、建筑等具体地点 |\n| employ sb to do sth | 雇用某人做某事 | employed an interior designer to match the drapes and wallpaper | 不定式说明雇用该人员的目的或工作内容 |\n| match A with B | 使 A 与 B 相配 | match the drapes and wallpaper perfectly with the antique desk | `with` 引出与 A 搭配、协调的对象 |\n"}, {"name": "04_语法点.md", "label": "04 语法点", "md": "# 04 语法点\n\nPart 5/6 的语法考点：先给规则，再用题里的句子作例证。同一考点（时态、虚拟语气、分词作定语……）已存在就往下补例句，不另起新条。\n\n\u003c!-- 新增考点时，复制下面这段模板到本注释下方填写；模板本身保留，供下次使用。\n\n## 考点名（如：现在完成时 vs 一般过去时）\n\n**规则**：判断依据 / 触发信号词，一两句说清。\n\n**例证**\n- 题中句：英文原文（标出关键信号词）。\n- 为什么这么选：……\n\n-->\n\n## 介词 vs 连词 vs 副词：看空格后接什么\n\n**规则**：空格后接「名词短语」就填介词（短语）；接「句子（主谓齐全）」才填连词；只能作状语的副词短语（by then、as much）既不能带名词宾语也不能引导句子，通常是干扰项。先判断空格后是名词还是句子，再排除。\n\n**例证**\n- 题中句：at least ten business days **prior to** the scheduled session（空格后是名词 the scheduled session）。\n- 为什么选 prior to：它是介词短语能带名词宾语；in case 是连词得接句子，by then、as much 是副词短语接不了名词，故全排除。\n- 题中句：**Due to** the heavy rain this morning, the city’s subway system is experiencing delays（空格后是名词短语 the heavy rain this morning）。\n- 为什么选 due to：`due to` 能直接接名词短语表原因；while、because、assuming 都是连词性用法，后面要接主谓完整的句子。\n- 题中句：continue **through** the upcoming holiday season（空格后是名词短语 the upcoming holiday season）。\n- 为什么选 through：`through` 是介词，可直接接时间段名词短语；whenever、once 是连词，要接句子；including 虽可接名词，但表示「包括」，不表示持续贯穿时间。\n\n## 人称代词格位：动词前缺主语用主格\n\n**规则**：空格后直接出现谓语动词，且前面没有主语时，空格处要填主格代词（I / we / he / she / they）。宾格、反身代词、名词性物主代词都不能单独作谓语动词的主语。\n\n**例证**\n- 题中句：Here at Auto Empire, **we** always put quality service and customer care first。\n- 为什么选 we：`put` 是谓语动词，前面缺主语；`we` 是主格，`ourselves / ours / us` 分别是反身代词、名词性物主代词、宾格，不能在这里作主语。\n\n## 最高级：the + 最高级 + of all\n\n**规则**：出现 `the ___ of all + 复数名词` 时，句子在比较三者及以上范围内的最高程度，空格处通常用形容词最高级。比较级只用于两者比较或有 `than` 等比较标志时。\n\n**例证**\n- 题中句：The store that Ms. Goh manages is **the largest of all** the company’s retail locations。\n- 为什么选 largest：`of all the company’s retail locations` 给出全部零售点这个范围，必须用最高级；`large` 是原级，`larger` 是比较级，`largely` 是副词。\n\n## 句子缺谓语动词：主语后选限定动词\n\n**规则**：一个分句必须有谓语动词。主语之后没有别的谓语、却给出某个词的多种形式时，要选限定动词（有时态、能作谓语）；现在分词 -ing（前面无 be）和名词都不能单独作谓语。选定后再核对主谓一致与时态。\n\n**例证**\n- 题中句：the director **suggested** filming the scene inside the studio（主语 the director 后缺谓语）。\n- 为什么选 suggested：suggesting 是分词、suggestion 是名词都不能作谓语；suggest 是原形与第三人称单数主语不一致（须 suggests）；suggested 过去式作谓语、主谓一致，且 `After ... days of delays` 提示过去时。\n\n## 所有格后缺主语名词：看后面谓语单复数\n\n**规则**：名词所有格（如 `Institute’s`）后通常接名词，表示「某机构 / 某人的……」。如果空格后出现谓语动词，要让空格处名词和谓语在人称、数上匹配。\n\n**例证**\n- 题中句：Singh Design Institute’s **teachers are** active professionals。\n- 为什么选 teachers：所有格后缺名词，且后面谓语是复数 `are`，所以要用复数名词 `teachers`；`teach / taught` 是动词形式，`teaching` 不表示复数人员，不能和 `are` 搭配。\n\n## so ... that 结果状语结构\n\n**规则**：`so + 形容词 / 副词 + that + 句子` 表「如此……以至于……」，`that` 后面的句子说明前面程度造成的结果。看到形容词后紧跟 `that + 主谓`，优先考虑 `so`。\n\n**例证**\n- 题中句：Our new electric saw is **so powerful that** it can cut sheets of metal up to one centimeter thick。\n- 为什么选 so：`powerful` 是形容词，后面的 `that it can cut ...` 是结果句；`quite` 只能加强语气，不能和 `that` 呼应；`too` 通常接 `to do`；`often` 是频率副词。\n\n## 词性判断：形容词后接名词，职位名词可接人名同位语\n\n**规则**：形容词后通常接名词构成名词短语；如果名词后逗号中出现人名，这个人名常是同位语，说明前面的名词应是职位、身份或人。\n\n**例证**\n- 题中句：The Langdon Company’s **financial specialist, Richard Bigsby, handles** all budgetary decisions。\n- 为什么选 specialist：`financial` 后缺名词，`Richard Bigsby` 是人名同位语，且后面单数谓语 `handles` 需要一个单数主语；`special` 是形容词，`specialization` 是抽象名词，`specialize` 是动词。\n\n## 冠词 an 后接单数可数名词\n\n**规则**：`a / an` 后面要接单数可数名词，不能接复数名词、副词或不可数抽象名词。若空格后还有 `in + 领域`，常是在说明人的身份或专业领域。\n\n**例证**\n- 题中句：Joshua Ramsey, **an expert in** climate science。\n- 为什么选 expert：`an` 要接单数可数名词，`expert` 指人且可数；`expertise` 是不可数抽象名词，`expertly` 是副词，`experts` 是复数名词。\n\n## 过去分词作后置定语：名词与动作是被动关系\n\n**规则**：名词后需要补充说明，且名词与动作是被动关系时，可用过去分词短语作后置定语，相当于省略了 `that / which + be` 的定语从句。句子已有谓语时，不能再填完整谓语。\n\n**例证**\n- 题中句：a new environmental agency **established to address** the city’s pollution problem。\n- 为什么选 established：`agency` 是被成立的对象，`established to address ...` 相当于 `that was established to address ...`；`was established` 是完整谓语，会和前面的 `is` 冲突；`establishing` 表主动关系，不合逻辑。\n\n## 过去分词作前置定语：表示被动或完成\n\n**规则**：过去分词可放在名词前作形容词，表示被动含义或已经完成的状态。判断时看空格后是否已有名词；若需要修饰名词，通常不用动词原形、名词或主动含义的现在分词。\n\n**例证**\n- 题中句：their **designated parking space**。\n- 为什么选 designated：`parking space` 前缺修饰语，停车位是「被指定」的对象；`designating` 表主动，`designation` 是名词，`designate` 是动词原形，都不能自然修饰 `parking space`。\n\n## 副词 + 形容词 + 名词：程度副词修饰形容词\n\n**规则**：名词前需要描述性质时用形容词；若形容词前还有 `particularly / very / highly` 等程度副词，结构是「副词修饰形容词，形容词修饰名词」。不能用名词、动词或副词本身去占形容词位置。\n\n**例证**\n- 题中句：the **particularly soft materials** they use。\n- 为什么选 soft：`materials` 前缺形容词说明材料特性，`particularly` 修饰形容词 `soft`；`soften` 是动词，`softness` 是名词，`softly` 是副词，都不能直接作 `materials` 的前置定语。\n\n## under + 名词：表示进行中的状态\n\n**规则**：`under + 抽象名词` 可表示「处于……状态 / 正在被……」，常见于 `under construction / under review / under consideration`。这类结构重点看固定搭配，不要只按中文把近义名词硬套进去。\n\n**例证**\n- 题中句：is currently **under construction**。\n- 为什么选 construction：`under construction` 是固定表达，表示建筑物或设施正在建设中；`building` 虽可表示建筑物或建造，但不构成 `under building`；`processing` 多用于订单、申请、数据；`decision` 不能表达施工状态。\n\n## 副词修饰过去分词形容词：说明状态的方式、程度或时间\n\n**规则**：过去分词可作形容词表示状态，前面常用副词补充说明，如 `temporarily suspended / newly opened / fully booked`。判断时看副词语义是否能自然说明这个状态。\n\n**例证**\n- 题中句：will be **temporarily suspended**。\n- 为什么选 temporarily：`suspended` 表服务被暂停，`temporarily` 说明暂停是临时的；`accurately` 修饰准确性，`broadly` 修饰范围或概括程度，`privately` 修饰私人方式，都不能说明交通服务暂停的时间性质。\n\n## such an + 形容词 + 单数名词\n\n**规则**：`such a / an + 形容词 + 单数可数名词` 表「如此……的一个……」。空格位于 `such an` 和单数名词之间时，通常需要形容词；名词、动词、副词都不能直接占这个位置。\n\n**例证**\n- 题中句：such an **innovative advertising campaign**。\n- 为什么选 innovative：`advertising campaign` 是单数名词短语，前面需要形容词说明性质；`innovation` 是名词，`innovate` 是动词，`innovatively` 是副词，都不能放在 `such an` 后直接修饰名词短语。\n\n## 量词修饰复数可数名词：many + 复数名词\n\n**规则**：`many` 可直接修饰复数可数名词；`every` 后接单数可数名词；`plenty` 通常要写成 `plenty of + 名词`；`most` 表「大多数」时通常需要明确范围或上下文限定。\n\n**例证**\n- 题中句：there will be **many opportunities** to sample products。\n- 为什么选 many：`opportunities` 是复数可数名词，`many opportunities` 结构自然；`plenty` 缺少 `of`，`every` 不能接复数名词，`most` 不符合句中「许多机会」的意思。\n\n## 被动语态：主语是动作承受者时用 be + 过去分词\n\n**规则**：当主语不是动作发出者，而是被评价、被指定、被暂停、被认为的对象时，用 `be + 过去分词`。遇到 `regard A as B` 这类主动结构，若 A 被提前作主语，要变成 `A be regarded as B`。\n\n**例证**\n- 题中句：Charles Campbell **is regarded as** one of the most influential modern authors。\n- 为什么选 is regarded：Charles Campbell 是被评价的人，不是主动“认为”别人；`regards` 和 `has regarded` 都是主动语态且缺宾语，`regarding` 不能单独作谓语。\n\n## 名词作定语：名词 + 名词构成复合名词\n\n**规则**：英语中名词可放在另一个名词前作定语，说明类别、用途或领域，如 `delivery program / parking space / sales trend`。这类位置通常不用动词原形、谓语动词或不合义的分词形式。\n\n**例证**\n- 题中句：Bigmart’s same-day **delivery program**。\n- 为什么选 delivery：`program` 前需要说明计划类型，`delivery` 作名词定语表示「配送计划」；`deliver` 和 `delivers` 是动词形式，`delivered` 表「被送达的」时修饰对象通常是物品，不适合修饰 `program`。\n\n## 冠词 + 形容词 + 名词：中心名词位置\n\n**规则**：`a / an + 形容词 + 名词` 中，形容词只负责修饰，真正被冠词限定、承担句子成分的是后面的名词。空格在形容词后时，通常要选符合句意和搭配的名词。\n\n**例证**\n- 题中句：a cost-effective **method** for harnessing solar energy。\n- 为什么选 method：`cost-effective` 是形容词，后面需要名词作中心词；`method for doing sth` 表「做某事的方法」，`response / biology / excursion` 与 `harnessing solar energy` 语义不搭。\n\n## be 后接形容词作表语：说明主语状态\n\n**规则**：`be` 后可接形容词作表语，说明主语处于什么状态。政策、规则、变更等作主语时，`be effective` 表「生效 / 有效」。\n\n**例证**\n- 题中句：they will not be **effective** until next month。\n- 为什么选 effective：空格在 `be` 后说明 `changes` 的状态，要用形容词；`effect / effects` 是名词，`effectively` 是副词，都不能作表语形容词。\n\n## the most + 形容词 + 名词\n\n**规则**：`the most + 形容词 + 名词` 表最高程度的名词性质，如 `the most optimistic forecasts`。空格在 `the most` 后、名词前时，通常需要形容词。\n\n**例证**\n- 题中句：the most **optimistic forecasts**。\n- 为什么选 optimistic：`forecasts` 前需要形容词说明预测性质；`optimist` 和 `optimism` 是名词，`optimistically` 是副词，不能直接修饰名词。\n\n## 所有格后接名词作中心词\n\n**规则**：所有格如 `Ms. Cho’s / the company’s / his` 后面通常接名词或名词短语，构成句子的主语、宾语或其他名词性成分。若空格后有 `for / in / of` 等介词短语，常是在修饰前面的名词中心词。\n\n**例证**\n- 题中句：Ms. Cho’s **enthusiasm for** oil painting。\n- 为什么选 enthusiasm：`Ms. Cho’s ___ for oil painting` 整体作主语，空格需要抽象名词；`enthusiastic` 是形容词，`enthusiastically` 是副词，`enthusiast` 指人，语义都不合。\n\n## 非限制性定语从句：which 指物 / 事\n\n**规则**：逗号隔开的非限制性定语从句用于补充说明前面的名词或整句话。先行词是物、职位、事情或整个情况时，常用 `which`；先行词是人时才用 `who`。\n\n**例证**\n- 题中句：The managerial role, **which was previously done by** David Copper, will be taken over by Sharon Wells。\n- 为什么选 which：先行词 `role` 是职位 / 职责，不是人；`who` 指人，`whoever / whichever` 带有「无论谁 / 无论哪一个」的泛指或选择含义，不能指代前面的 `role`。\n\n## in a + 形容词 + manner\n\n**规则**：`in a ... manner` 表「以……方式」。空格在冠词 `a` 和名词 `manner` 之间时，需要形容词修饰 `manner`；副词可以直接修饰动词，但不能放在这个名词位置。\n\n**例证**\n- 题中句：welcomes every customer **in a courteous manner**。\n- 为什么选 courteous：`courteous` 是形容词，能修饰 `manner`；`courtesy / courtesies` 是名词，`courteously` 是副词，不能放在 `a` 和 `manner` 之间。\n\n## 形容词性物主代词 + 名词\n\n**规则**：名词前需要表示所属关系时，用形容词性物主代词，如 `my / your / his / her / its / our / their + 名词`。名词性物主代词如 `hers` 已经相当于名词短语，后面不能再接名词。\n\n**例证**\n- 题中句：will release **her first solo album**。\n- 为什么选 her：`first solo album` 是名词短语，前面需要限定词；`her` 可直接修饰名词，`herself` 是反身代词，`she` 是主格代词，`hers` 是名词性物主代词，三者都不能放在名词前。\n\n## 副词修饰实义动词\n\n**规则**：实义动词前后需要说明动作的方式、频率、程度或可靠性时，通常用副词。形容词修饰名词或作表语，名词和动词原形不能直接充当副词。\n\n**例证**\n- 题中句：software **reliably predicts** storms。\n- 为什么选 reliably：`predicts` 是谓语动词，前面需要副词说明预测是否可靠；`reliable` 是形容词，`reliability` 是名词，`rely` 是动词原形，都不能修饰 `predicts`。\n- 题中句：match the drapes and wallpaper **perfectly** with the antique desk。\n- 为什么选 perfectly：空格说明 `match` 的搭配效果，需要副词作方式状语；`perfect` 是形容词，`perfected` 是过去式或过去分词，`perfection` 是名词，都不能直接修饰 `match`。\n\n## when 引导时间状语从句：从句用一般现在时表将来\n\n**规则**：`when + 主语 + 谓语` 可引导时间状语从句，表示「当……时」。谈论将来事件时，主句可用将来时，但 `when` 从句通常用一般现在时表示将来，即「主将从现」。\n\n**例证**\n- 题中句：to pick up the clients **when they arrive at the airport**。\n- 为什么选 when：空格后 `they arrive at the airport` 是完整句子，需要连词连接；`when` 能说明接客户发生在他们抵达机场时。`during` 和 `regarding` 是介词，不能直接接完整句子，`just` 是副词，不能连接两个分句。\n"}, {"name": "05_长难句.md", "label": "05 长难句", "md": "# 05 长难句\n\nPart 7 里读不顺的长难句：拆主干、标修饰、给翻译。\n\n\u003c!-- 新增长难句时，复制下面这段模板到本注释下方填写；模板本身保留，供下次使用。\n\n## 句子主题 / 核心结构\n\n**原句**\n> 英文原文\n\n**主干**：抽掉修饰后的主谓宾骨架。\n\n**修饰拆解**\n- 某从句 / 分词 / 介词短语：修饰谁，作什么成分。\n\n**翻译**：中文。\n\n-->\n"}, {"name": "06_商务场景表达.md", "label": "06 商务场景表达", "md": "# 06 商务场景表达\n\n邮件、会议、合同等商务场景的高频表达，按场景归类，方便按情境复习。\n\n| 场景 | 表达（英文原文） | 含义 / 用法 | 题中例句 |\n|------|------------------|-------------|----------|\n| 客户服务 | put quality service and customer care first | 把优质服务和客户关怀放在首位，常用于公司服务理念或品牌承诺 | Here at Auto Empire, we always put quality service and customer care first. |\n| 零售门店 | retail locations | 零售点、门店、线下销售地点；公司谈门店规模或网点分布时常用 | all the company’s retail locations |\n| 教育培训 | active professionals | 仍在行业中活跃工作的专业人士，常用于说明教师、讲师或顾问具备实务经验 | are active professionals who have worked in the industry for many years |\n| 交通通知 | subway system is experiencing delays | 地铁系统正在出现延误，常用于公共交通、通勤或运营通知 | the city’s subway system is experiencing delays |\n| 产品性能 | can cut sheets of metal up to one centimeter thick | 能切割厚达一厘米的金属板，用于说明工具、机器或设备性能 | it can cut sheets of metal up to one centimeter thick |\n| 财务职责 | handles all budgetary decisions | 负责处理所有预算决策，常用于说明财务、管理岗位职责 | Richard Bigsby, handles all budgetary decisions |\n| 活动通知 | is excited to announce that this month’s guest speaker is ... | 很高兴宣布本月嘉宾演讲者是……，用于学校、会议或活动公告 | is excited to announce that this month’s guest speaker is Joshua Ramsey |\n| 环境治理 | address the city’s pollution problem | 处理 / 解决城市污染问题，常用于政府、机构或环保项目说明 | established to address the city’s pollution problem |\n| 员工规定 | use their designated parking space | 使用自己的指定停车位，常用于公司内部规定或设施使用说明 | Each employee is expected to use their designated parking space |\n| 销售趋势 | upward trend in sales is likely to continue | 销售额上升趋势很可能继续，用于销售报告、业绩预测或市场分析 | The current upward trend in sales is likely to continue through the upcoming holiday season |\n| 产品材料评价 | be praised for the particularly soft materials | 因材料特别柔软而受到称赞，常用于产品评价、宣传或用户反馈 | Jackson Bedding’s mattress lines have been praised for the particularly soft materials they use |\n| 商场扩建 | a new annex is currently under construction | 新附属建筑正在建设中，常用于商业地产、设施扩建或施工公告 | A new annex, which will expand the Bayview Mall, is currently under construction |\n| 交通维修通知 | train service will be temporarily suspended | 列车服务将暂时暂停，常用于维修、施工或运营调整公告 | Train service to and from the Luzern District will be temporarily suspended while repairs are being made |\n| 广告营销 | produce an innovative advertising campaign | 制作创新广告活动，常用于产品上市、品牌推广或营销成果评价 | Ms. Fong for producing such an innovative advertising campaign for the new line of televisions |\n| 展会试吃 / 试用 | sample products and learn how they are made | 试吃 / 试用产品并了解制作过程，常用于食品饮料展会、产品展示或品牌推广 | At the Food & Beverage Fair, there will be many opportunities to sample products and learn how they are made |\n| 零售配送 | same-day delivery program | 当日配送计划，常用于零售、电商或本地门店配送服务 | Meridian Town was already participating in Bigmart’s same-day delivery program |\n| 能源技术 | a cost-effective method for harnessing solar energy | 利用太阳能的高性价比方法，常用于研发、环保技术或能源项目说明 | A researcher from Beckerton University has developed a cost-effective method for harnessing solar energy |\n| 政策变更 | changes to the company policy will be effective | 公司政策变更将生效，常用于内部通知、制度更新或合规公告 | Some changes to the company policy have been formally agreed upon, but they will not be effective until next month |\n| 行业增长与预测 | growth surpassed even the most optimistic forecasts | 增长超过最乐观预测，常用于行业报告、财务表现或市场分析 | The fertilizer industry grew by 26 percent last year, which surpassed even the most optimistic forecasts |\n| 会议演示反馈 | rehearse a presentation in front of colleagues to receive feedback | 在同事面前排练演示以获得反馈，常用于会议准备、培训或销售汇报场景 | Mr. Salvador rehearsed his presentation in front of his colleagues to receive feedback |\n| 职务交接 | a managerial role will be taken over by someone | 某个管理职位 / 职责将由某人接手，常用于人事任命、岗位变更或交接通知 | The managerial role will be taken over by Sharon Wells as early as next month |\n| 客户接待 | welcome every customer in a courteous manner | 以礼貌的方式欢迎每位顾客，常用于前台、客服、门店或保险服务场景 | The new receptionist at Clarwell Insurance welcomes every customer in a courteous manner |\n| 音乐发行 | release her first solo album | 发行她的首张个人专辑，常用于音乐、娱乐新闻或宣传公告 | Samantha Nighting will release her first solo album later this year |\n| 天气预测软件 | weather simulation software reliably predicts storms | 天气模拟软件可靠地预测风暴，常用于技术产品说明、气象服务或软件宣传 | Our new weather simulation software reliably predicts storms up to two weeks before they occur |\n| 零售营业时间调整 | have extended hours of operation | 延长营业时间，常用于旺季、促销期或客流增加时的门店运营安排 | To handle the additional customers during the summer, our store will have extended hours of operation |\n| 机场客户接待 | pick up the clients when they arrive at the airport | 客户抵达机场时去接机，常用于商务差旅、访客安排或接待计划 | Mr. Patel will be leaving work early today to pick up the clients when they arrive at the airport |\n| 办公室室内设计 | employ an interior designer to match the drapes and wallpaper with an antique desk | 聘请室内设计师协调窗帘、墙纸和家具，常用于办公室装修或布置 | The newspaper recently employed an interior designer to match the drapes and wallpaper perfectly with the antique desk in the editor’s office |\n"}, {"name": "07_易混词辨析.md", "label": "07 易混词辨析", "md": "# 07 易混词辨析\n\n形近、义近词放一起辨析，讲清区别点（词义侧重、搭配、可数性、及物性……）。\n\n| 易混词组 | 区别（侧重 / 搭配 / 用法） | 题中例句（英文原文） |\n|----------|---------------------------|----------------------|\n| rapid / bright / loud / proud | `rapid` 表速度快，能修饰 `expansion`；`bright` 表明亮、聪明或前景好，不表示扩张速度；`loud` 多指声音大或颜色醒目；`proud` 表自豪，通常修饰人或组织。 | has seen rapid expansion in East Asia |\n| large / larger / largely / largest | `large` 是原级；`larger` 是比较级；`largest` 是最高级，和 `the ... of all` 搭配；`largely` 是副词，表示「主要地 / 很大程度上」，不能作最高级形容词。 | the largest of all the company’s retail locations |\n| teach / taught / teaching / teachers | `teach` 是动词原形；`taught` 是过去式 / 过去分词；`teaching` 是动名词或现在分词，不表示复数人员；`teachers` 是复数名词，可作 `are` 的主语。 | Singh Design Institute’s teachers are active professionals |\n| often / so / quite / too | `so` 可和 `that` 构成 `so + adj. + that` 结果结构；`often` 表频率；`quite` 只表示程度，不能和 `that` 呼应；`too` 常接 `to do` 表过度。 | so powerful that it can cut sheets of metal |\n| special / specialization / specialize / specialist | `special` 是形容词；`specialization` 是抽象名词，表示专业化或专长；`specialize` 是动词；`specialist` 是表示人的名词，可作职位身份。 | financial specialist, Richard Bigsby |\n| expertise / expert / expertly / experts | `expertise` 是不可数抽象名词，表示专业知识；`expert` 是单数可数名词，指专家；`expertly` 是副词；`experts` 是复数名词，不能和 `an` 搭配。 | an expert in climate science |\n| establish / established / establishing / was established | `establish` 是动词原形；`established` 可作过去分词，表示被动后置定语；`establishing` 是现在分词，表示主动；`was established` 是完整谓语，不能放在已有谓语的句子中。 | a new environmental agency established to address the city’s pollution problem |\n| designating / designated / designation / designate | `designated` 是过去分词形容词，表示「指定的」；`designating` 是现在分词，偏主动；`designation` 是名词；`designate` 是动词原形，不能直接修饰 `parking space`。 | designated parking space |\n| whenever / through / including / once | `through` 是介词，可接时间段表示持续贯穿；`whenever` 和 `once` 是连词，后面要接句子；`including` 表包括，不表示持续时间。 | continue through the upcoming holiday season |\n| soften / softness / soft / softly | `soft` 是形容词，可修饰 `materials`；`soften` 是动词，表示变软或使变软；`softness` 是名词，表示柔软性；`softly` 是副词，不能直接修饰名词。 | particularly soft materials |\n| construction / building / processing / decision | `construction` 和 `under` 构成固定表达 `under construction`，表示正在建设中；`building` 可指建筑物或建造行为，但不说 `under building`；`processing` 多指订单、申请、数据处理中；`decision` 表决定，不能表达施工状态。 | under construction |\n| accurately / temporarily / broadly / privately | `temporarily` 表暂时地，可修饰 `suspended` 说明服务临时暂停；
